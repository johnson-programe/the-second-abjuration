 hol_joint_wic_olie_idea:0 "炼油协定"
 hol_joint_wic_olie_idea_desc:0 "炼塔的产出优先供应宗主国。"
 hol_joint_vloot_idea:0 "分舰队"
 hol_joint_vloot_idea_desc:0 "威廉斯塔德成为共和国的加勒比锚地。"
 hol_joint_sa_idea:0 "自治领协定"
 hol_joint_sa_idea_desc:0 "矿产与兵源开放，内部事务自治。"
 hol_joint_luchtvaart_idea:0 "帝国航线"
 hol_joint_luchtvaart_idea_desc:0 "阿姆斯特丹—巴达维亚—开普敦。"
 hol_joint_rijksdag_idea:0 "帝国议会"
 hol_joint_rijksdag_idea_desc:0 "宗主国与自治领共商事务的常设机构。"
