 hol_koloniaal_dividend_idea:0 "殖民分红"
 hol_koloniaal_dividend_idea_desc:0 "各总督区的产出按季结算，折成工厂与原料汇入海牙。"
 hol_holland_idea:0 "荷兰省"
 hol_holland_idea_desc:0 "阿姆斯特丹与鹿特丹的资本、船坞与银行，是共和国的心脏。"
 hol_gelderland_idea:0 "海尔德兰"
 hol_gelderland_idea_desc:0 "东部诸省的农庄与兵源，供养共和国的陆军。"
 hol_friesland_idea:0 "弗里斯兰"
 hol_friesland_idea_desc:0 "北方诸省的牧场与航运，压低全国的生活成本。"
 hol_republiek.50.t:0 "联合议会开幕"
 hol_republiek.50.d:0 "巴达维亚、帕拉马里博与比勒陀利亚的代表走进海牙的议事厅。他们不是来听训的，是来谈条件的。"
 hol_republiek.50.a:0 "给他们席位。"
 hol_republiek.51.t:0 "帝国议会第一次会议"
 hol_republiek.51.d:0 "共和国的旗帜下，总督区与自治领第一次以平等的身份坐在同一张长桌前。"
 hol_republiek.51.a:0 "记录在案。"
 hol_republiek.52.t:0 "建省诏令"
 hol_republiek.52.d:0 "新的土地被划入共和国的版图。地图绘制员连夜赶工，把占领区的虚线改成实线。"
 hol_republiek.52.a:0 "画上去。"
 hol_republiek.60.t:0 "西印度公司的特许状"
 hol_republiek.60.d:0 "旧特许状在档案柜底层躺了一百四十年。今天它被重新盖章生效——苏里南与库拉索从此由公司治理，向海牙纳贡。"
 hol_republiek.60.a:0 "盖章。"
 hol_republiek.61.t:0 "南方十省的合并"
 hol_republiek.61.d:0 "布鲁塞尔的议会以微弱多数通过了合并案。列日的工厂主与安特卫普的码头工人都盯着海牙——他们想知道自己现在算什么人。"
 hol_republiek.61.a:0 "让他们成为公民。"
 hol_republiek.62.t:0 "比勒陀利亚签字"
 hol_republiek.62.d:0 "联邦内阁在协议上签了字。兰德的金矿、开普敦的船坞，从此向共和国敞开——代价是海牙承诺不碰他们的内政。"
 hol_republiek.62.a:0 "记入账册。"
 hol_republiek.63.t:0 "里斯本的殖民地易主"
 hol_republiek.63.d:0 "里斯本没有能力再守住果阿、帝汶和莫桑比克。它们被移交给比勒陀利亚——名义上是托管，实际上再也不会回来了。"
 hol_republiek.63.a:0 "接管。"
 hol_republiek.70.t:0 "金本位的葬礼"
 hol_republiek.70.d:0 "九月二十六日，海牙宣布放弃金本位。科尔ijn在日记里只写了一行字：'我们守了五年的东西，一夜之间没了。'"
 hol_republiek.70.a:0 "记入档案。"
 hol_republiek.71.t:0 "王冠越过议会"
 hol_republiek.71.d:0 "女王直接召见了三位大臣，没有经过议会。宪法没有明文禁止，但所有人都知道这条线被跨过去了。"
 hol_republiek.71.a:0 "记入档案。"
 hol_republiek.72.t:0 "没有王冠的会议"
 hol_republiek.72.d:0 "海牙的议事厅里，主席台上是空的。一百五十年来第一次，没有人代表王冠坐在那里。"
 hol_republiek.72.a:0 "记入档案。"
 hol_republiek.73.t:0 "执政一职被废除"
 hol_republiek.73.d:0 "投票结果出来时，议事厅安静了几秒。然后有人站起来，把奥兰治的旗帜从墙上取了下来。"
 hol_republiek.73.a:0 "记入档案。"
 hol_republiek.74.t:0 "十七位绅士"
 hol_republiek.74.d:0 "东印度公司的董事会重新坐进议事厅。他们带来的不是宪法草案，是账簿。"
 hol_republiek.74.a:0 "记入档案。"
 hol_republiek.75.t:0 "一七九八年的文本"
 hol_republiek.75.d:0 "档案管理员花了三天才找到那份宪法。纸已经发黄，但条款还能读。"
 hol_republiek.75.a:0 "记入档案。"
 hol_republiek.76.t:0 "柱子倒下"
 hol_republiek.76.d:0 "新教、天主教、社会主义、自由派——四根柱子在同一周里被拆掉。人们第一次不知道自己的邻居属于哪个阵营。"
 hol_republiek.76.a:0 "记入档案。"
 hol_republiek.77.t:0 "联省同盟成立"
 hol_republiek.77.d:0 "海牙向所有还愿意听小国说话的首都发出了邀请。回信比预想的多。"
 hol_republiek.77.a:0 "记入档案。"
 hol_republiek.78.t:0 "西印度公司的特许状"
 hol_republiek.78.d:0 "特许状从档案柜底层被抽出来。它从未被正式废除，只是被遗忘了。"
 hol_republiek.78.a:0 "记入档案。"
 hol_republiek.79.t:0 "三块圭亚那"
 hol_republiek.79.d:0 "荷属、英属、法属。地图上三块颜色不同的地，说着三种语言，却是同一条河的下游。"
 hol_republiek.79.a:0 "记入档案。"
 hol_republiek.80.t:0 "一五七九，一六四八，一八三〇"
 hol_republiek.80.d:0 "三次撕裂，三次都没能愈合。海牙的档案里存着每一次的条约原件。"
 hol_republiek.80.a:0 "记入档案。"
 hol_republiek.81.t:0 "南方十省"
 hol_republiek.81.d:0 "布鲁塞尔的报纸把合并案称为'一次迟到的修正'。安特卫普的码头工人则在讨论工资。"
 hol_republiek.81.a:0 "记入档案。"
 hol_republiek.82.t:0 "阿图瓦与佛兰德"
 hol_republiek.82.d:0 "一六五九年和一六七八年被割走的两块地，地图上还留着旧边界。现在它们被重新画了回来。"
 hol_republiek.82.a:0 "记入档案。"
 hol_republiek.83.t:0 "完整的低地"
 hol_republiek.83.d:0 "从斯海尔德河到莱茵河，从北海到阿登。四百年的裂缝，在这一天被合上了。"
 hol_republiek.83.a:0 "记入档案。"
 hol_republiek.84.t:0 "南洋的边界"
 hol_republiek.84.d:0 "海牙的地图室接到命令：把东方的边界一直画到能画的地方为止。"
 hol_republiek.84.a:0 "记入档案。"
 hol_republiek.85.t:0 "南洋建省"
 hol_republiek.85.d:0 "新的省份被刻上印章。总督区的公文从此和本土的省份用同一种格式。"
 hol_republiek.85.a:0 "记入档案。"
 hol_republiek.90.t:0 "工厂落成"
 hol_republiek.90.d:0 "新厂房的烟囱在圩田上竖起来。工程师说这是全国第一座建在海平面以下的轧钢厂。"
 hol_republiek.90.a:0 "继续。"
 hol_republiek.91.t:0 "里斯本的移交"
 hol_republiek.91.d:0 "果阿、帝汶、莫桑比克——三份移交文书在同一天签署。里斯本的代表没有出席。"
 hol_republiek.91.a:0 "继续。"
 hol_republiek.92.t:0 "美洲建省"
 hol_republiek.92.d:0 "帕拉马里博的公文柜里多了一整排新的省档案。"
 hol_republiek.92.a:0 "继续。"


# ===== Auto-generated completion events (v14) =====
 hol_republiek.86.t:0 "汇兑银行"
 hol_republiek.86.d:0 "阿姆斯特丹的汇兑银行重新开张。汇票再次以荷兰盾结算，共和国的信用高过任何一位君主。"
 hol_republiek.86.a:0 "记入史册。"
 hol_republiek.87.t:0 "公司即国家"
 hol_republiek.87.d:0 "特许状被改写，共和国直接持有公司股权。各省是股东，议会就是股东大会。"
 hol_republiek.87.a:0 "记入史册。"
 hol_republiek.88.t:0 "黄金时代的回归"
 hol_republiek.88.d:0 "商行报出的利润自十七世纪六十年代以来未见。账本第一次压过了旧世纪。"
 hol_republiek.88.a:0 "记入史册。"
 hol_republiek.89.t:0 "重建市政官会议"
 hol_republiek.89.d:0 "自我延续的市政官会议重新召开。执政阶层回到熟悉的席位，共和国又像从前的样子。"
 hol_republiek.89.a:0 "记入史册。"
 hol_republiek.93.t:0 "股份与选票"
 hol_republiek.93.d:0 "选举权跟随可税财富，一如旧共和国。持有国家的人，持有选票。"
 hol_republiek.93.a:0 "记入史册。"
 hol_republiek.94.t:0 "海洋自由论"
 hol_republiek.94.d:0 "格劳秀斯的信条被重新定为国策：自由船，自由货。舰队奉命保护航道，而非劫掠它。"
 hol_republiek.94.a:0 "记入史册。"
 hol_republiek.95.t:0 "武装中立"
 hol_republiek.95.d:0 "不结盟，但全副武装。中立被宣布为一桩生意，共和国打算一直做下去。"
 hol_republiek.95.a:0 "记入史册。"
 hol_republiek.96.t:0 "雇佣军饷"
 hol_republiek.96.d:0 "共和国不征召公民，只雇佣士兵。领饷的军团在联省旗帜下行进。"
 hol_republiek.96.a:0 "记入史册。"
 hol_republiek.97.t:0 "一人一票"
 hol_republiek.97.d:0 "1917与1919年未竟的事业画上句号。选举权扩及每一位成年公民，不分男女阶级。"
 hol_republiek.97.a:0 "记入史册。"
 hol_republiek.98.t:0 "国民议会"
 hol_republiek.98.d:0 "一国，一院，一票。等级会议解散，代之以坐在海牙的单一民选议会。"
 hol_republiek.98.a:0 "记入史册。"
 hol_republiek.99.t:0 "巴达维亚的黎明"
 hol_republiek.99.d:0 "共和国第一次属于每一位荷兰人，而非海外某个王朝。黎明在巴达维亚与阿姆斯特丹同时破晓。"
 hol_republiek.99.a:0 "记入史册。"
 hol_republiek.100.t:0 "社会契约"
 hol_republiek.100.d:0 "国家自摇篮到坟墓背负公民。一份福利契约被写入共和国的法律。"
 hol_republiek.100.a:0 "记入史册。"
 hol_republiek.101.t:0 "公民学校"
 hol_republiek.101.d:0 "教育不再交给教派，而归共和国。每座城镇都办起一所公民学校。"
 hol_republiek.101.a:0 "记入史册。"
 hol_republiek.102.t:0 "人民军"
 hol_republiek.102.d:0 "每位公民皆兵，每位士兵皆公民。民兵取代雇佣营，成为共和国的盾牌。"
 hol_republiek.102.a:0 "记入史册。"
 hol_republiek.103.t:0 "无阶级的尼德兰"
 hol_republiek.103.d:0 "共和国没有臣民，只有公民。旧的等级从名册上划去。"
 hol_republiek.103.a:0 "记入史册。"
 hol_republiek.104.t:0 "人民民主"
 hol_republiek.104.d:0 "共和国的榜样走得比舰队更远。民主使节带着宪法走向海外的小国。"
 hol_republiek.104.a:0 "记入史册。"
 hol_republiek.105.t:0 "常驻使节"
 hol_republiek.105.d:0 "常驻使团派往每一座仍愿听小国说话的首都。共和国在每张桌子前都留一把椅子。"
 hol_republiek.105.a:0 "记入史册。"
 hol_republiek.106.t:0 "中立同盟"
 hol_republiek.106.d:0 "斯德哥尔摩、哥本哈根、奥斯陆、伯尔尼——同样拒绝选边的国家。一个不结盟同盟在海牙签字。"
 hol_republiek.106.a:0 "记入史册。"
 hol_republiek.107.t:0 "姐妹共和国"
 hol_republiek.107.d:0 "共和国不征服，只扶植。北方诸民主国被承认为天然盟友，获颁友好宪章。"
 hol_republiek.107.a:0 "记入史册。"
 hol_republiek.108.t:0 "汉萨协定"
 hol_republiek.108.d:0 "古老的北海与波罗的海商路因新约重连。汉萨诸城再次在同一面便利旗帜下贸易。"
 hol_republiek.108.a:0 "记入史册。"
 hol_republiek.109.t:0 "殖民集团"
 hol_republiek.109.d:0 "里斯本与马德里也握有海外帝国，且惧怕同样的掠食者。一个殖民集团被提议对抗列强。"
 hol_republiek.109.a:0 "记入史册。"
 hol_republiek.110.t:0 "世界港"
 hol_republiek.110.d:0 "鹿特丹不只是荷兰的港口，而是欧洲的。挖泥船拓宽河口，世界的粮食与矿石经此而过。"
 hol_republiek.110.a:0 "记入史册。"
 hol_republiek.111.t:0 "苏里南铝土"
 hol_republiek.111.d:0 "铝土被证明比黄金更值钱。苏里南河沿岸的特许权交给共和国的冶炼厂。"
 hol_republiek.111.a:0 "记入史册。"
 hol_republiek.112.t:0 "库拉索炼油厂"
 hol_republiek.112.d:0 "委内瑞拉原油遇见库拉索的炼塔。这座岛成为共和国在加勒比的泵血之心。"
 hol_republiek.112.a:0 "记入史册。"
 hol_republiek.113.t:0 "圭亚那总督领"
 hol_republiek.113.d:0 "圭亚那被设为向共和国纳贡的总督领。一位总督—执政由海牙任命。"
 hol_republiek.113.a:0 "记入史册。"
 hol_republiek.114.t:0 "南美大陆"
 hol_republiek.114.d:0 "委内瑞拉与哥伦比亚就在圭亚那以西。共和国的代理人测绘着进军的路线。"
 hol_republiek.114.a:0 "记入史册。"
 hol_republiek.115.t:0 "拉丁美洲"
 hol_republiek.115.d:0 "从巴拿马到拉普拉塔，一个接一个的总督领被规划出来。帝国的地图向南重绘。"
 hol_republiek.115.a:0 "记入史册。"
 hol_republiek.116.t:0 "十七省"
 hol_republiek.116.d:0 "整个勃艮第的遗产一举被主张：南北十七省，同属一共和国。"
 hol_republiek.116.a:0 "记入史册。"
 hol_republiek.117.t:0 "卢森堡"
 hol_republiek.117.d:0 "1815至1890年，大公与国王本是同一人。旧日的君合被记起，并被主张。"
 hol_republiek.117.a:0 "记入史册。"
 hol_republiek.118.t:0 "莱茵共和国"
 hol_republiek.118.d:0 "共和国不吞下德国，而是在莱茵河畔扶起一个姐妹共和国，以条约与贸易相连。"
 hol_republiek.118.a:0 "记入史册。"
 hol_republiek.160.t:0 "第二次十天战役"
 hol_republiek.160.d:0 "1831年的战事只持续十天。这一次共和国出征，要彻底了结南方问题。"
 hol_republiek.160.a:0 "记入史册。"
 hol_republiek.161.t:0 "失落的商馆"
 hol_republiek.161.d:0 "马六甲、锡兰、好望角、台湾——公司失去的，共和国决心夺回。首批远征得到拨款。"
 hol_republiek.161.a:0 "记入史册。"
 hol_republiek.162.t:0 "东印度联邦"
 hol_republiek.162.d:0 "东印度不再是殖民地，而是与共和国共戴一顶王冠的联邦。巴达维亚在议会中得一席。"
 hol_republiek.162.a:0 "记入史册。"
 hol_republiek.135.t:0 "帝国关税同盟"
 hol_republiek.135.d:0 "帝国内部关税废除。货物自由往来于阿姆斯特丹、巴达维亚、帕拉马里博与好望角之间。"
 hol_republiek.135.a:0 "记入史册。"
 hol_republiek.136.t:0 "帝国航运"
 hol_republiek.136.d:0 "帝国的航运由共和国商船队承运。船队凭同一张执照、同一部法律航行。"
 hol_republiek.136.a:0 "记入史册。"
 hol_republiek.137.t:0 "帝国防御公约"
 hol_republiek.137.d:0 "对任一殖民地的进攻，被宣布为对全帝国的进攻。驻军计划统一于海牙。"
 hol_republiek.137.a:0 "记入史册。"
 hol_republiek.138.t:0 "爪哇工业带"
 hol_republiek.138.d:0 "海牙出资本，殖民地出土地与劳力。一条共享的工业带在爪哇北岸兴起。"
 hol_republiek.138.a:0 "记入史册。"
 hol_republiek.139.t:0 "石油与锡"
 hol_republiek.139.d:0 "资源协定：产出按固定份额北运，以海牙定价。石油与锡让共和国的灯火长明。"
 hol_republiek.139.a:0 "记入史册。"
 hol_republiek.140.t:0 "皇家东印度军"
 hol_republiek.140.d:0 "同一编制，同一操典，海牙派监察官。殖民军被纳入共和国的战斗序列。"
 hol_republiek.140.a:0 "记入史册。"
 hol_republiek.141.t:0 "人民议会"
 hol_republiek.141.d:0 "殖民议会得席位，也担义务。巴达维亚向联省议会派出代表。"
 hol_republiek.141.a:0 "记入史册。"
 hol_republiek.142.t:0 "整个南洋"
 hol_republiek.142.d:0 "下一步去哪里，共同决定。群岛的地图向海牙的规划者敞开。"
 hol_republiek.142.a:0 "记入史册。"
 hol_republiek.143.t:0 "泗水舰队"
 hol_republiek.143.d:0 "殖民港口向共和国舰队开放。一支舰队驻泊泗水，守卫东方海面。"
 hol_republiek.143.a:0 "记入史册。"
 hol_republiek.144.t:0 "远东空军"
 hol_republiek.144.d:0 "航线与机场置于共管之下。共和国的飞机从苏门答腊直抵菲律宾。"
 hol_republiek.144.a:0 "记入史册。"
 hol_republiek.145.t:0 "帕拉马里博工业"
 hol_republiek.145.d:0 "海牙出资本，殖民地出土地与劳力。工坊沿苏里南河铺开。"
 hol_republiek.145.a:0 "记入史册。"
 hol_republiek.146.t:0 "铝土与冶炼"
 hol_republiek.146.d:0 "资源协定：产出按固定份额北运，以海牙定价。铝土喂饱共和国的冶炼炉。"
 hol_republiek.146.a:0 "记入史册。"
 hol_republiek.147.t:0 "西印度卫队"
 hol_republiek.147.d:0 "同一编制，同一操典，海牙派监察官。总督领的卫队听命于共和国。"
 hol_republiek.147.a:0 "记入史册。"
 hol_republiek.148.t:0 "总督领议会"
 hol_republiek.148.d:0 "殖民议会得席位，也担义务。帕拉马里博向联省议会发出声音。"
 hol_republiek.148.a:0 "记入史册。"
 hol_republiek.149.t:0 "拉丁美洲"
 hol_republiek.149.d:0 "下一步去哪里，共同决定。总督领的代理人侦察西面的大陆。"
 hol_republiek.149.a:0 "记入史册。"
 hol_republiek.150.t:0 "加勒比舰队"
 hol_republiek.150.d:0 "殖民港口向共和国舰队开放。一支舰队驻泊库拉索，守卫加勒比。"
 hol_republiek.150.a:0 "记入史册。"
 hol_republiek.151.t:0 "加勒比空军"
 hol_republiek.151.d:0 "航线与机场置于共管之下。共和国的飞机巡弋安的列斯。"
 hol_republiek.151.a:0 "记入史册。"
 hol_republiek.152.t:0 "兰德工业"
 hol_republiek.152.d:0 "海牙出资本，殖民地出土地与劳力。兰德的矿脉喂出新工坊。"
 hol_republiek.152.a:0 "记入史册。"
 hol_republiek.153.t:0 "黄金与煤"
 hol_republiek.153.d:0 "资源协定：产出按固定份额北运，以海牙定价。黄金与煤跨海而来。"
 hol_republiek.153.a:0 "记入史册。"
 hol_republiek.154.t:0 "联邦国防军"
 hol_republiek.154.d:0 "同一编制，同一操典，海牙派监察官。自治领的军队与共和国绑定。"
 hol_republiek.154.a:0 "记入史册。"
 hol_republiek.155.t:0 "自治领议会"
 hol_republiek.155.d:0 "殖民议会得席位，也担义务。比勒陀利亚向联省议会发出声音。"
 hol_republiek.155.a:0 "记入史册。"
 hol_republiek.156.t:0 "非洲内陆"
 hol_republiek.156.d:0 "下一步去哪里，共同决定。内陆的地图向海牙的规划者敞开。"
 hol_republiek.156.a:0 "记入史册。"
 hol_republiek.157.t:0 "西蒙斯敦基地"
 hol_republiek.157.d:0 "殖民港口向共和国舰队开放。西蒙斯敦设基地，守卫好望角航线。"
 hol_republiek.157.a:0 "记入史册。"
 hol_republiek.158.t:0 "南非空军"
 hol_republiek.158.d:0 "航线与机场置于共管之下。共和国的飞机巡弋高原。"
 hol_republiek.158.a:0 "记入史册。"
 hol_republiek.120.t:0 "勘探石油"
 hol_republiek.120.d:0 "地质学家散入圩田。六十天后，国家账上多了四桶油。"
 hol_republiek.120.a:0 "记入史册。"
 hol_republiek.121.t:0 "开发铁矿"
 hol_republiek.121.d:0 "古老的铁山重新开采。六十天后，国家账上多了四吨钢。"
 hol_republiek.121.a:0 "记入史册。"
 hol_republiek.122.t:0 "开发铝土"
 hol_republiek.122.d:0 "铝土矿脉被开采。六十天后，国家账上多了四吨铝土。"
 hol_republiek.122.a:0 "记入史册。"
 hol_republiek.123.t:0 "殖民征募"
 hol_republiek.123.d:0 "在东西印度招募辅助团。殖民地的预算在母国征不到人的地方买到兵。"
 hol_republiek.123.a:0 "记入史册。"
 hol_republiek.124.t:0 "警察国家"
 hol_republiek.124.d:0 "殖民秩序交给军队。总督睡得安稳，殖民地盯着兵营。"
 hol_republiek.124.a:0 "记入史册。"
 hol_republiek.125.t:0 "续签特许状"
 hol_republiek.125.d:0 "共和国重新颁发东印度贸易特许状。旧公司的权利以新专利确认。"
 hol_republiek.125.a:0 "记入史册。"
 hol_republiek.126.t:0 "重组总督领"
 hol_republiek.126.d:0 "每一块傀儡地都升为总督领。共和国因掌控更紧而多得工厂。"
 hol_republiek.126.a:0 "记入史册。"
 hol_republiek.127.t:0 "购买英属圭亚那"
 hol_republiek.127.d:0 "伦敦需要现金，海牙需要入海口。契约签下，乔治敦换旗。"
 hol_republiek.127.a:0 "记入史册。"
 hol_republiek.128.t:0 "购买法属圭亚那"
 hol_republiek.128.d:0 "巴黎不会高兴，但巴黎很穷。入海口以代价易主。"
 hol_republiek.128.a:0 "记入史册。"
 hol_republiek.129.t:0 "吞并卢森堡"
 hol_republiek.129.d:0 "旧的君合终于了结。大公国回到共和国的怀抱。"
 hol_republiek.129.a:0 "记入史册。"
 hol_republiek.130.t:0 "向东印度征用"
 hol_republiek.130.d:0 "原料自巴达维亚运出，换回国内一座工厂的产出。共和国的工坊轰鸣。"
 hol_republiek.130.a:0 "记入史册。"
 hol_republiek.131.t:0 "在东印度募兵"
 hol_republiek.131.d:0 "战争期间在东印度募集辅助军。群岛送出它的子弟。"
 hol_republiek.131.a:0 "记入史册。"
 hol_republiek.132.t:0 "库拉索石油配额"
 hol_republiek.132.d:0 "库拉索炼油厂的产出优先输往母国。共和国的油箱先于殖民地加满。"
 hol_republiek.132.a:0 "记入史册。"
 hol_republiek.133.t:0 "撤换总督"
 hol_republiek.133.d:0 "海牙直接撤掉一位抗命的总督。殖民地怀恨，但命令有效。"
 hol_republiek.133.a:0 "记入史册。"
# ===== v15 military / expansion / joint focuses =====
 hol_mil_opbouw:0 "重整共和国军队"
 hol_mil_opbouw_desc:0 "宣誓弃绝已成往事，可年轻的共和国依旧孤立无援。三级议会必须重建昔日令帝国胆寒的陆海空三军——趁某个强权还没有把这新生的联邦当作猎物。"
 hol_landmacht:0 "扩充陆军"
 hol_landmacht_desc:0 "各省的义勇兵连必须熔铸成一支统一而职业化的陆军，足以守住本土的堤坝与圩田。"
 hol_speciale_troepen:0 "精锐突击部队"
 hol_speciale_troepen_desc:0 "共和国素来依海而生。一支海军陆战队与空降突击兵，将让我们把拳头伸到狭小的国境之外。"
 hol_pantser:0 "装甲军团"
 hol_pantser_desc:0 "上次大战的教训显而易见：决定下一场战争的，是钢铁与引擎，而非静止的堑壕。共和国必须掌握坦克。"
 hol_weermacht:0 "常备军"
 hol_weermacht_desc:0 "拿起武器的公民仍是共和国的灵魂——但唯有常设且训练有素的常备军，才能保证1581年争得的自由永不拱手让人。"
 hol_zeemacht:0 "扩充舰队"
 hol_zeemacht_desc:0 "贸易是共和国的命脉，而贸易需要海军护航。新的主力舰与护航舰艇将确保航道畅通。"
 hol_onderzee:0 "潜艇部队"
 hol_onderzee_desc:0 "面对任何更强的对手，水下无声的兵种都是我们的平衡器。一支潜艇舰队将威慑所有威胁我们的商路。"
 hol_vloot:0 "大洋舰队"
 hol_vloot_desc:0 "共和国不能只守住海港——它必须再次拥有跨越大洋投送力量的能力。"
 hol_luchtmacht:0 "组建空军"
 hol_luchtmacht_desc:0 "天空是新的战场。共和国将组建航空中队，守护城市，并从高空打击敌人。"
 hol_jacht:0 "战斗机司令部"
 hol_jacht_desc:0 "截击机必须保住本土领空，让任何一架轰炸机都无法抵达阿姆斯特丹、鹿特丹或乌得勒支。"
 hol_bommen:0 "轰炸机司令部"
 hol_bommen_desc:0 "若战火烧到我们头上，我们就把它烧回去。一支战略轰炸机力量将直击任何侵略者的工业心脏。"
 hol_herover_lage_landen:0 "重夺低地诸国"
 hol_herover_lage_landen_desc:0 "共和国主张维也纳会议所给、一八三〇年所夺的一切。向欧洲各国宫廷递交主张；研究南方要塞；并按低地模式重组军队——从弗里斯兰到阿登的一支军队，在圩田与森林中同样能战。"
 hol_offensief_frankrijk:0 "对法攻势"
 hol_offensief_frankrijk_desc:0 "自路易十四以来，巴黎就是欧洲的仲裁者，而共和国为此付出过两次代价。呈交议会的计划并非防御性的：军队将越过边境，夺取北方要塞，并在一座从未被荷兰军队占领过的城市里定下条件。参谋部称之为大胆，大议长称之为必要。"
 hol_joint_raad:0 "共和国议会"
 hol_joint_raad_desc:0 "一个统一的议会，如今将本土与海外各省联结在一起，让联邦在贸易、防务与法律事务上以同一个声音说话。"
 hol_joint_tolvrij:0 "自由贸易区"
 hol_joint_tolvrij_desc:0 "关税壁垒在本土与各领地之间轰然倒下，把联邦编织成一体、自我强化的统一市场。"
 hol_joint_scheepvaart:0 "联合航运"
 hol_joint_scheepvaart_desc:0 "共和国与其领地的商船队同挂一面旗帜，汇聚船只、船员与航线，遍布全球。"
 hol_joint_defensie:0 "联合防务"
 hol_joint_defensie_desc:0 "各领地的军队将与本土并肩而立，任何一方的受袭，都将得到全体的回应。"
 hol_ins_industrie:0 "东印度工业化"
 hol_ins_industrie_desc:0 "爪哇与苏门答腊的工厂得以现代化，为共和国的战时经济输血。"
 hol_ins_resources:0 "开发东印度资源"
 hol_ins_resources_desc:0 "橡胶、石油与锡矿，从群岛更充沛地流向本土。"
 hol_ins_leger:0 "东印度陆军"
 hol_ins_leger_desc:0 "一支殖民地军队得以组建与操练，随时准备保卫群岛、抵御任何来犯之敌。"
 hol_ins_vloot:0 "东印度舰队"
 hol_ins_vloot_desc:0 "一支地区舰队守护着东方至关重要的海峡与航道。"
 hol_ins_lucht:0 "东印度空军"
 hol_ins_lucht_desc:0 "驻扎群岛的航空中队，日夜监视着通往群岛的各个方向。"
 hol_sur_industrie:0 "西印度工业化"
 hol_sur_industrie_desc:0 "炼油厂与工坊在圭亚那和加勒比诸岛拔地而起。"
 hol_sur_resources:0 "开发西印度资源"
 hol_sur_resources_desc:0 "铝土、甘蔗与木材以工业化规模开采，供共和国使用。"
 hol_sur_leger:0 "西印度陆军"
 hol_sur_leger_desc:0 "一支驻防部队守护美洲领地，抵御当地动荡与外国干涉。"
 hol_sur_vloot:0 "西印度舰队"
 hol_sur_vloot_desc:0 "一支分舰队巡弋加勒比海，护卫糖与铝土的护航船队。"
 hol_sur_lucht:0 "西印度空军"
 hol_sur_lucht_desc:0 "遍布诸岛的机场，为共和国在西半球提供了一个立足点。"
 hol_saf_industrie:0 "非洲工业化"
 hol_saf_industrie_desc:0 "矿山与铁路，把非洲领地的内陆向共和国的工业敞开。"
 hol_saf_resources:0 "开发非洲资源"
 hol_saf_resources_desc:0 "黄金、钻石与煤炭，以不断增长的数量运回本土。"
 hol_saf_leger:0 "非洲陆军"
 hol_saf_leger_desc:0 "一支纪律严明的部队，守住开普与内陆，抵御一切来者。"
 hol_saf_vloot:0 "非洲舰队"
 hol_saf_vloot_desc:0 "以开普为基地的海军力量，守护通往东印度的航线。"
 hol_saf_lucht:0 "非洲空军"
 hol_saf_lucht_desc:0 "空中巡逻掠过草原，时刻监视着领地的边疆。"
# ===== v15 spirit =====
 hol_weermacht_idea:0 "常备军"
 hol_weermacht_idea_desc:0 "一支常备的职业军队枕戈待旦，誓死捍卫共和国的自由。它的操练与纪律令所有邻国艳羡。"
# ===== v15 events =====
 hol_republiek.190.t:0 "共和国重整军备"
 hol_republiek.190.d:0 "三级议会已批准拨款，共和国的船坞、铸造厂与机场焕发出新的生机。老水手们仍记得海上乞丐攻占布里勒的那一天；如今，新的一代人在七省之旗下立下同样的誓言。"
 hol_republiek.190.a:0 "为了共和国"
 hol_republiek.191.t:0 "低地诸国宣告不可分割"
 hol_republiek.191.d:0 "三级议会宣告布拉班特、佛兰德与瓦隆与共和国不可分割。告示在七省的每座城镇宣读，各团整装待发。比利时与卢森堡面临一个简单的选择：回归联邦，或是被夺回。"
 hol_republiek.191.a:0 "低地诸国归于我们"
 hol_republiek.200.t:0 "通往巴黎之路"
 hol_republiek.200.d:0 "南部边境暂时平静，但也只是暂时。将军们把地图铺在三级议会面前，询问共和国准备走多远。这个答案将决定对法战争是雷霆万钧地开始，还是从容不迫地展开。"
 hol_republiek.200.a:0 "进军巴黎"
 hol_republiek.200.b:0 "先巩固后方"
 hol_republiek.203.t:0 "联邦第一次议会"
 hol_republiek.203.d:0 "来自巴达维亚、帕拉马里博、比勒陀利亚与海牙的代表首次齐聚。古老的争论再次浮现：共和国应当从中央发号施令，还是信任各省与领地自行治理？"
 hol_republiek.203.a:0 "由中央统率"
 hol_republiek.203.b:0 "信任各省自治"
 hol_republiek.204.t:0 "吞并比利时"
 hol_republiek.204.d:0 "布鲁塞尔兵不血刃，南尼德兰重归联邦。然而，如何接纳它们，将在未来数代人中留下回响——是作为平等的省份，还是作为被征服的土地。"
 hol_republiek.204.a:0 "视若平等地接纳"
 hol_republiek.204.b:0 "视作被征服的土地"
 hol_republiek.205.t:0 "西印度公司特许状"
 hol_republiek.205.d:0 "西印度公司的特许状即将续签。股东们要求获得对美洲领地的广泛权力，摄政们则主张克制。共和国必须决定，给它的贸易臂膀多大的自主权。"
 hol_republiek.205.a:0 "授予完整特许状"
 hol_republiek.205.b:0 "限制特许状"
# ===== v15.2 joint directorates =====
 hol_joint_sur:0 "西印度理事会"
 hol_joint_sur_desc:0 "一个常设理事会如今治理美洲各省，与共和国议会协调其防务、贸易与发展。"
 hol_joint_ins:0 "东印度理事会"
 hol_joint_ins_desc:0 "辽阔的群岛被置于单一理事会之下，把爪哇、苏门答腊与外围岛屿系于共和国的意志。"
 hol_joint_saf:0 "非洲理事会"
 hol_joint_saf_desc:0 "开普领地被赋予自己的理事会，负责守护通往东印度的南方航线。"
 hol_joint_rijksbezit:0 "联合联邦"
 hol_joint_rijksbezit_desc:0 "本土与殖民地熔铸为一个联邦，各省以统一的关税、舰队与誓约相连。"
 hol_sur_militair:0 "西印度军事顾问团"
 hol_sur_militair_desc:0 "一支参谋团训练殖民地军队。殖民地征召四千人；海牙获得经验，也得到一个更顺从的属地。"
