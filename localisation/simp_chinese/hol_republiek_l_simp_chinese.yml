 hol_dividend_burgundy_idea:0 "勃艮第分红"
 hol_dividend_burgundy_idea_desc:0 "南方十省的煤与钢，按季结算进海牙的账房。"
 hol_dividend_rhine_idea:0 "莱茵分红"
 hol_dividend_rhine_idea_desc:0 "莱茵的工业产出，先过鹿特丹。"
 hol_dividend_wic_idea:0 "西印度分红"
