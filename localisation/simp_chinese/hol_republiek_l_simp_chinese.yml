 # ===== v2 新增 =====
 hol_erfenis_1815:0 "一八一五年的遗产"
 hol_erfenis_1815_desc:0 "维也纳会议上诞生的这个王国本就是妥协的产物：北方与南方两个民族被套上同一顶王冠，而殖民帝国由海牙治理。一个世纪过去，妥协已磨损殆尽。共和国继承了王国的债务、舰队、殖民地——以及拿这三样怎么办的问题。"
 hol_crisisjaren:0 "危机岁月"
 hol_crisisjaren_desc:0 "一九二九年的崩盘清空了鹿特丹的仓库，也让三分之一的码头工人领上了救济。旧的自由主义共识——节俭与自由贸易——已无话可说。在各省的辩论厅里，人们开始追问：君主制本身是否就是问题的一部分。"
 hol_kroon:0 "王冠与议会"
 hol_kroon_desc:0 "王冠已成累赘。它签署内阁写好的文件，用并非自己撰写的演说词开幕国会，却要为每一次歉收与每一家关门的工厂受过。海牙的沙龙里，人们不再谈君主制会不会倒，而是谈它倒下时谁会还站着。"
 hol_conventie:0 "制宪会议"
 hol_conventie_desc:0 "代表们被召到海牙：摄政与船主、牧师与教师、码头工人与殖民地官员。他们的任务不亚于为一个尚不存在的国家起草宪法。每一条条文都是妥协，而每一个妥协都有敌人。"
 hol_uitroeping:0 "共和国宣告"
 hol_uitroeping_desc:0 "在内庭的台阶上，文书被高声宣读，一七九五年的巴达维亚誓言终于由第二次弃绝来回应。执政官的宅邸被封闭，共和国的旗帜在努尔登德宫上升起，欧洲各国被告知：联省共和国已重归列强之席。"
 hol_gezicht:0 "共和国的面貌"
 hol_gezicht_desc:0 "共和国是什么？是股东的联合，还是公民的联合？"
 hol_ware_vrijheid:0 "真正的自由"
 hol_ware_vrijheid_desc:0 "德·维特的旧词：没有执政的共和国，才是自由的共和国。"
 hol_heren_xvii:0 "十七绅士"
 hol_heren_xvii_desc:0 "东印度公司的董事会重新坐进议事厅。这一次，他们管的是整个国家。"
 hol_wisselbank:0 "汇兑银行"
 hol_wisselbank_desc:0 "阿姆斯特丹汇兑银行被改革，储备向国家敞开。信用才是共和国真正的军队：有了稳健的盾，议会能以三厘借款，而敌人要付七厘，于是不必加征一分新税就能支撑一场战争。"
 hol_compagnie_staat:0 "公司即国家"
 hol_compagnie_staat_desc:0 "公司不是国家，却统治着一个：它征兵、铸币、与土著王公缔约，并向阿姆斯特丹的股东派发红利。议会辩论着该把它国有化、解散，还是干脆承认人尽皆知的事实——共和国的帝国是一家挂着国旗的私人企业。"
 hol_gouden_eeuw:0 "黄金时代的回归"
 hol_gouden_eeuw_desc:0 "仓库满了，交易所喧闹，画家们的订单多到画不完。自十七世纪以来，共和国第一次不只是存活，而是在繁荣——而繁荣，正如摄政们深知的那样，总会引来掠食者。"
 hol_vroedschap:0 "市议会的复兴"
 hol_vroedschap_desc:0 "城市重新交还给自我延续的市政议会。"
 hol_aandeel_stem:0 "股份与选票"
 hol_aandeel_stem_desc:0 "投票权跟着财产走。这是共和国的老规矩。"
 hol_mare_liberum:0 "自由海洋"
 hol_mare_liberum_desc:0 "格劳秀斯的法则：自由之船，自由之货。"
 hol_neutraliteit:0 "武装中立"
 hol_neutraliteit_desc:0 "不结盟，但武装到牙齿。中立是一门生意。"
 hol_soldij:0 "雇佣兵的薪水"
 hol_soldij_desc:0 "共和国不征召公民，它雇佣士兵。"
 hol_bataafse_grondwet:0 "巴达维亚宪法"
 hol_bataafse_grondwet_desc:0 "一七九八年的宪法从档案里被取出。这一次它不会再被撕掉。"
 hol_een_man_een_stem:0 "一人一票"
 hol_een_man_een_stem_desc:0 "把一九一七和一九一九没做完的事做完。"
 hol_nationale_vergadering:0 "国民议会"
 hol_nationale_vergadering_desc:0 "一个民族，一个议会，一院制。"
 hol_zuilen_vallen:0 "柱柱皆倒"
 hol_zuilen_vallen_desc:0 "新教柱、天主教柱、社会主义柱、自由派柱——全部拆掉。"
 hol_dageraad:0 "巴达维亚的黎明"
 hol_dageraad_desc:0 "共和国第一次属于所有荷兰人。"
 hol_maatschappelijk_verdrag:0 "社会契约"
 hol_maatschappelijk_verdrag_desc:0 "从摇篮到坟墓，国家负责。"
 hol_burgerschool:0 "公民的学校"
 hol_burgerschool_desc:0 "教育不是教派的事，是共和国的事。"
 hol_volksleger:0 "人民的军队"
 hol_volksleger_desc:0 "每个公民都是士兵，每个士兵都是公民。"
 hol_klasseloos:0 "无阶级的尼德兰"
 hol_klasseloos_desc:0 "共和国没有臣民，只有公民。"
 hol_volksdemocratie:0 "人民民主"
 hol_volksdemocratie_desc:0 "共和国的榜样比它的舰队走得更远。"
 hol_eigen_koers:0 "自己的航向"
 hol_eigen_koers_desc:0 "共和国不加入任何人的阵营，它自己开一个。"
 hol_gezanten:0 "常驻使团"
 hol_gezanten_desc:0 "共和国的使节在从哥本哈根到里斯本的每一处宫廷受到接见。他们的训令很简单：不结永久同盟，不许外国驻军，不签无法用盾支付的条约。这是老政策，而它让共和国活了三百年。"
 hol_neutrale_liga:0 "中立同盟"
 hol_neutrale_liga_desc:0 "斯德哥尔摩、哥本哈根、奥斯陆、伯尔尼——那些同样不想选边的国家。"
 hol_zusterrepublieken:0 "姊妹共和国"
 hol_zusterrepublieken_desc:0 "欧洲还有别的共和国，共和国已开始清点它们。瑞士、威尼斯的幽魂、德意志自由市、波罗的海的新国家——都小、都经商、都畏惧同样的大国。一个姐妹共和国的联盟，就是幸存者的联盟。"
 hol_hanze_akkoord:0 "汉萨协定"
 hol_hanze_akkoord_desc:0 "北海与波罗的海的旧商路，用一份新条约重新接上。"
 hol_zuid_afrika:0 "南非的血亲"
 hol_zuid_afrika_desc:0 "开普在归属英国之前属于荷兰，共和国并未忘记。该领地被重组为「尼德兰属非洲」：南非荷兰语在法庭上获得承认，荷兰资本进入矿场，舰队在萨尔达尼亚湾获得通往东印度的基地。"
 hol_koloniaal_blok:0 "殖民国家集团"
 hol_koloniaal_blok_desc:0 "欧洲的殖民国家受邀来到海牙：不是为了瓜分世界，而是为了保住它。关税、航线、土著劳工的待遇与热带的共同防务都被摆上桌面。仍紧抓着帝国残片的马德里与里斯本，得到了一把椅子与一份保证。"
 hol_wereldhaven:0 "世界港"
 hol_wereldhaven_desc:0 "鹿特丹被疏浚，马斯平原被勘测，莱茵驳船有了深水泊位。十年之内，这座港口的吞吐量将超过欧洲任何一处，而共和国从每一只从鲁尔运往大西洋的箱子上收取通行费。事实证明，中立是一门生意。"
 hol_wic:0 "西印度公司重生"
 hol_wic_desc:0 "西印度公司再度获授特许状，这一次由共和国亲自授予。其辖区从斯海尔德河直到奥里诺科河：苏里南的糖、库拉索的盐，以及终有一天比两者都更值钱的铝土。公司董事得到一支舰队，并被叮嘱不要弄丢它。"
 hol_suriname_bauxiet:0 "苏里南的铝土"
 hol_suriname_bauxiet_desc:0 "铝土矿比黄金更值钱。"
 hol_curacao:0 "库拉索的炼油厂"
 hol_curacao_desc:0 "委内瑞拉的原油，库拉索的炼塔。"
 hol_guiana:0 "圭亚那"
 hol_guiana_desc:0 "三块圭亚那：荷属、英属、法属。只有一块是我们的。"
 hol_guiana_vazal:0 "圭亚那总督区"
 hol_guiana_vazal_desc:0 "圭亚那成为总督区，向共和国纳贡。"
 hol_zuid_amerika:0 "南美大陆"
 hol_zuid_amerika_desc:0 "委内瑞拉和哥伦比亚就在圭亚那西边。"
 hol_latijns_amerika:0 "拉丁美洲"
 hol_latijns_amerika_desc:0 "从巴拿马到拉普拉塔，总督区一个接一个。"
 hol_scheuring:0 "分裂的伤口"
 hol_scheuring_desc:0 "南方诸省从未接受一八三九年的安排，共和国也从未接受失去它们。谈及「分裂的伤口」，就是重新揭开一个世纪的积怨：斯海尔德河关税、天主教问题、以及在起义前供养荷兰炉子的瓦隆煤。被撕开的，仍可缝合。"
 hol_zeventien:0 "十七省"
 hol_zeventien_desc:0 "旧名重回地图：十七省，从格罗宁根到阿图瓦。共和国的书记官重划省界，恢复古老的议会席位，并悄悄准备着让南方诸省重回联盟的法律文书。"
 hol_luxemburg:0 "卢森堡"
 hol_luxemburg_desc:0 "大公国是被从未见过它的人从旧勃艮第遗产中切出来的。它的要塞在一八六七年被拆除，语言在一八三九年被压制，人民像抵押品一样在诸王冠之间转手。共和国给予维也纳从未给予的东西：联盟中的一席之地。"
 hol_belgie:0 "比利时"
 hol_belgie_desc:0 "布鲁塞尔不是被征服，而是被接纳。南方诸省得到与一五七九年相同的条件：自己的议会、自己的特权、自己的语言，以换取誓约与舰队。列日与沙勒罗瓦的大工场被勘测，荷兰工程师开始起草连接斯海尔德河与默兹河的运河。"
 hol_bourgondie:0 "勃艮第总督区"
 hol_bourgondie_desc:0 "南方十省不再是一个王国，而是一个总督区——向共和国的账房纳贡。"
 hol_rijnrepubliek:0 "莱茵共和国"
 hol_rijnrepubliek_desc:0 "莱茵河对岸，旧日的教会选侯领与鲁尔谷地已然敞开。一个中立、非军事化、经济上系于阿姆斯特丹的莱茵共和国，将同时为共和国提供缓冲与市场。德意志诸邦虚弱，法国分身乏术，而这条河足够宽。"
 hol_tweede_tiendaagse:0 "第二次十日战役"
 hol_tweede_tiendaagse_desc:0 "一八三一年的十日战役只打了十天。这一次不会这么短。"
 hol_franse_nederlanden:0 "法兰西尼德兰"
 hol_franse_nederlanden_desc:0 "阿图瓦、康布雷与南方的旧勃艮第领地，在归属法国之前曾是荷兰的。共和国不索求它们——它只是刊印中世纪的特许状、关税簿与旧地图，让律师去做军队将要完成的事。"
 hol_verenigde_nederlanden:0 "完整的低地"
 hol_verenigde_nederlanden_desc:0 "一五七九年的事业终于完成：北方与南方、圩田与瓦隆谷地，合为一个尼德兰。国会设于海牙，执政官宫殿成了博物馆，而从巴达维亚飘到帕拉马里博的旗帜上，褶皱着十七个省。"
 hol_groot_oost_indie:0 "大东印度"
 hol_groot_oost_indie_desc:0 "东印度不是一块殖民地，而是一片由岛屿组成的大陆，共和国决定把它们作为一个整体来治理。巴达维亚设总督，统辖爪哇、苏门答腊、婆罗洲与外围岛屿；荷印军扩编为一支足以守住它们的殖民地军队。"
 hol_verloren_factorijen:0 "失落的商馆"
 hol_verloren_factorijen_desc:0 "马六甲、锡兰、好望角、台湾。公司失去的，共和国要拿回来。"
 hol_indische_federatie:0 "南洋联邦"
 hol_indische_federatie_desc:0 "东印度不再是一块殖民地，而是与共和国共戴一冠的联邦。"
 hol_kern_azie:0 "南洋建省"
 hol_kern_azie_desc:0 "把共和国在亚洲的全部领地纳入核心。"
 hol_gezanten_idea:0 "常驻使团"
 hol_gezanten_idea_desc:0 "小国的声音，靠人跑出来。"
 hol_neutrale_liga_idea:0 "中立同盟"
 hol_neutrale_liga_idea_desc:0 "不选边，但彼此担保。"
 hol_zusterrepublieken_idea:0 "姊妹共和国"
 hol_zusterrepublieken_idea_desc:0 "民主国家的天然盟友。"
 hol_hanze_akkoord_idea:0 "汉萨协定"
 hol_hanze_akkoord_idea_desc:0 "旧商路，新条约。"
 hol_zuid_afrika_idea:0 "南非血亲"
 hol_zuid_afrika_idea_desc:0 "同一种语言，同一段记忆。"
 hol_koloniaal_blok_idea:0 "殖民集团"
 hol_koloniaal_blok_idea_desc:0 "有海外帝国的国家，彼此都怕。"
 hol_wereldhaven_idea:0 "世界港"
 hol_wereldhaven_idea_desc:0 "欧洲的货，从鹿特丹走。"
 hol_bourgondie_idea:0 "勃艮第总督区"
 hol_bourgondie_idea_desc:0 "南方十省重新挂上共和国的旗。"
 hol_bourgondische_vazal_idea:0 "勃艮第地位"
 hol_bourgondische_vazal_idea_desc:0 "总督治理，资源与工厂优先供应海牙。"
 hol_rijnrepubliek_idea:0 "莱茵共和国"
 hol_rijnrepubliek_idea_desc:0 "莱茵河上多了一个姊妹共和国。"
 hol_rijn_vazal_idea:0 "莱茵地位"
 hol_rijn_vazal_idea_desc:0 "莱茵的煤与钢，先过鹿特丹。"
 hol_indische_federatie_idea:0 "南洋联邦"
 hol_indische_federatie_idea_desc:0 "共戴一冠的联邦。"
 BUR:0 "勃艮第总督区"
 BUR_DEF:0 "勃艮第总督区"
 BUR_ADJ:0 "勃艮第"
 RHE:0 "莱茵共和国"
 RHE_DEF:0 "莱茵共和国"
 RHE_ADJ:0 "莱茵"
 HOL_WI:0 "荷属西印度"
 HOL_WI_DEF:0 "荷属西印度"
 HOL_WI_ADJ:0 "西印度"
 hol_republiek_faction:0 "联省同盟"

 # ===== v3 新增 =====
 SUR_wic_gouverneur:0 "西印度公司总督"
 hol_wic_stichten:0 "西印度公司"
 hol_sticht_wic:0 "颁授西印度公司特许状"
 hol_sticht_wic_desc:0 "以德意志式总督辖区的形式重建西印度公司：苏里南与库拉索合并为一个总督区，向海牙纳贡。"
 hol_zuid_afrika_koop:0 "南非"
 hol_koop_zuid_afrika:0 "购买南非"
 hol_koop_zuid_afrika_desc:0 "用一笔足以让比勒陀利亚动心的价钱，把南非联邦变成共和国的自治领。"
 hol_koloniaal_bestuur:0 "殖民地事务"
 hol_indie_requisitie:0 "东印度物资征调"
 hol_indie_requisitie_desc:0 "从巴达维亚调运原料，换取本土一座工厂的产能。"
 hol_indie_troepen:0 "东印度征兵"
 hol_indie_troepen_desc:0 "战时从东印度征募辅助部队。"
 hol_wic_olie:0 "库拉索石油配额"
 hol_wic_olie_desc:0 "把库拉索炼油厂的产出优先拨给本土。"
 hol_gouverneur_ontslag:0 "撤换总督"
 hol_gouverneur_ontslag_desc:0 "海牙可以直接撤换不听话的总督——代价是殖民地的不满。"
 hol_kern_amerika:0 "美洲建省"
 hol_kern_amerika_desc:0 "把共和国在美洲的全部领地划归西印度公司，并由公司设省。"
 hol_wic_vazal_idea:0 "西印度公司总督区"
 hol_wic_vazal_idea_desc:0 "苏里南与库拉索合并为一个总督区，资源、工厂与船坞优先供应海牙。"
 hol_indie_vazal_idea:0 "东印度总督区"
 hol_indie_vazal_idea_desc:0 "巴达维亚由总督治理，向共和国纳贡并接受海牙的训令。"
 hol_zuid_afrika_vazal_idea:0 "南非自治领"
 hol_zuid_afrika_vazal_idea_desc:0 "比勒陀利亚承认海牙的宗主权，矿产与兵源向共和国开放。"
 hol_republiek.40.t:0 "比勒陀利亚的答复"
 hol_republiek.40.d:0 "联邦内阁没有立刻拒绝。他们问的是价钱，而不是原则——这在外交上通常意味着可以谈。"
 hol_republiek.40.a:0 "让财政部准备一份报价。"
 hol_republiek.41.t:0 "西印度公司的特许状"
 hol_republiek.41.d:0 "旧特许状的副本从档案柜最底层被抽出来。它从未被正式废除，只是被遗忘了。现在，它可以重新生效。"
 hol_republiek.41.a:0 "重新颁授。"

 # ===== v6 新增 =====
 hol_joint_indie_olie:0 "东印度石油协定"
