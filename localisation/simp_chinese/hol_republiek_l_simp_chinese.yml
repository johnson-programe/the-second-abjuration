 hol_dividend_indie_idea:0 "东印度分红"
 hol_dividend_indie_idea_desc:0 "东印度的资源与工厂，按特许状的比例上缴。"
 hol_dividend_sa_idea:0 "南非分红"
 hol_dividend_sa_idea_desc:0 "兰德的金矿与煤炭，向海牙开放。"
 hol_joint_indie_olie_idea:0 "石油协定"
 hol_joint_indie_olie_idea_desc:0 "原油优先北上，换取共和国的工业品。"
 hol_joint_leger_idea:0 "联合防务"
