 hol_offensief_brittannie:0 "对英攻势"
 hol_offensief_brittannie_desc:0 "英格兰是更老的敌人，也是更大的威胁。只要海峡仍是英国人的护城河，共和国在自己的水域里就永无安全。海军部已拟定在肯特海岸登陆的计划，由整个主力舰队支援——此前的两次尝试都失败了，而共和国打算试第三次。"
 hol_brother_republic:0 "兄弟共和国"
 hol_brother_republic_desc:0 "一个以誓约与利益系于联邦的姊妹共和国，自理其政，却忠于联合。"
