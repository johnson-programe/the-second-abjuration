# ===== v27 new keys =====
 hol_republiek.202.t:0 "第四次英荷战争"
 hol_republiek.202.d:0 "使团从伦敦空手而归。三个世纪以来，共和国与英格兰在同一片海上贸易、争吵、开战，如今账本终于合上。海军部已奉命在赫勒富茨劳斯备战；阿姆斯特丹的商行仍记得一七八〇年与上一场战争的损失，正悄悄把资本转移到中立港口。海峡之事，再无妥协余地。"
 hol_republiek.202.a:0 "舰队出航。"
 hol_republiek.210.t:0 "寄往北方的信"
 hol_republiek.210.d:0 "大议长花了整个冬天翻阅汉萨诸城的旧日书信。若共和国不愿只做十七世纪的一段回忆，就必须用北方听得懂的语言说话：谷物、木材、铁矿，以及厄勒海峡的自由通行。使节被派往哥本哈根、斯德哥尔摩、奥斯陆与赫尔辛基，携带着同一份提议——一个由自由的北方民族组成的联盟，以誓约而非征服系于共和国。"
 hol_republiek.210.a:0 "派出使节。"
 hol_republiek.211.t:0 "来自共和国的提议"
 hol_republiek.211.d:0 "荷兰使节在宫廷受到接见，外套上还带着海盐的气味。他谈起旧日的商路、海峡关税与鲱鱼船队，也谈起一个宁可要兄弟、不要臣民的共和国。作为誓约的交换，他许以荷兰舰队的庇护、东印度殖民市场的准入，以及海牙议会中的一席。宫廷意见分裂：商人赞成，贵族则惧怕失去独立。"
 hol_republiek.211.a:0 "宣誓。"
 hol_republiek.211.b:0 "我们自有主张。"
 hol_republiek.212.t:0 "北方的新兄弟"
 hol_republiek.212.d:0 "宣誓仪式朴素得出奇：没有王冠，没有香火，只有一纸签署的文书和泊地舰船的一声礼炮。又一个北方民族选择把自己的命运系于共和国。议会把这个名字记进与七省同册的簿子里，书记官干巴巴地注明：这本簿子快满了。"
 hol_republiek.212.a:0 "记入册中。"
 hol_republiek.220.t:0 "黑色矿层"
 hol_republiek.220.d:0 "工程师在南方诸省地下开凿了新的巷道。矿层又深又脏，矿工在灯光下轮班十二小时，但焦炭成车运出，共和国的炉子再也不必向鲁尔乞求燃料。公司已经申请开凿第二口竖井。"
 hol_republiek.220.a:0 "再开一口竖井。"
 hol_republiek.221.t:0 "橡胶园"
 hol_republiek.221.d:0 "第二条运河之外，丛林被辟成整齐的三叶橡胶树行列，天刚亮就由爪哇来的契约劳工割胶。乳胶熏成胶片运往鹿特丹，半个欧洲的价格在那里定下。种植园主请求更多的土地、更多的劳工，以及海军守护航线的保证。"
 hol_republiek.221.a:0 "再开垦一些。"
 hol_republiek.222.t:0 "开普的铬"
 hol_republiek.222.d:0 "测量队在德兰士瓦北部发现了一条绵延数英里的铬铁矿脉。那不是黄金，约翰内斯堡的矿业公司不感兴趣，但代尔夫特的冶金学家明白这意味着什么：装甲板、炮管、不锈钢。开普领已奉命立即动工。"
 hol_republiek.222.a:0 "动工开挖。"
 hol_republiek.223.t:0 "大工程"
 hol_republiek.223.d:0 "整整一年，这个省就是一片巨大的工地：排干圩田、铺设铁路、浇筑地基，在机器运到之前先为工人搭起住房。代价由消费者承担——少几辆自行车，少些咖啡，不买新收音机——但尘埃落定之时，牧场之上将立起两座新工厂。共和国一向是先建设，后争论。"
 hol_republiek.223.a:0 "先建设，后争论。"
 hol_noordse_liga:0 "北方联盟"
 hol_noordse_liga_desc:0 "共和国把目光转向北方。丹麦、瑞典、挪威与芬兰受邀以兄弟共和国之名宣誓——内政自理，而在舰队、关税与外交上系于海牙。"
 hol_lage_landen_leger_idea:0 "低地军团"
 hol_lage_landen_leger_idea_desc:0 "佛兰德、布拉班特与瓦隆谷地的新兵填满了行伍：共和国的军队不再是圩田的军队，而是低地的军队。"
 hol_develop_coal:0 "开采煤田"
 hol_develop_coal_desc:0 "在南方煤田开凿新巷道。九十天后该州获得 4 点钢铁——是供给炉子的焦炭，而非矿砂。"
 hol_develop_rubber:0 "开辟橡胶园"
 hol_develop_rubber_desc:0 "如苏门答腊与马来亚的种植园主那样，砍伐丛林种下三叶橡胶。九十天后该州获得 6 点橡胶。"
 hol_develop_chromium:0 "开采铬铁矿"
 hol_develop_chromium_desc:0 "勘测并开采德兰士瓦的铬铁矿脉。一百二十天后该州获得 6 点铬。"
 hol_grote_ontwikkeling:0 "大工程"
 hol_grote_ontwikkeling_desc:0 "一年的征调劳力与征用产出。工程期间消费品上升 10%；完工后该州获得两座民用工厂与两个建筑位。"

