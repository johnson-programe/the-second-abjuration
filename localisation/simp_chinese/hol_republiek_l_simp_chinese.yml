 # ===== 决议 =====
 hol_ontwikkeling:0 "国土开发"
 hol_ontwikkeling_desc:0 "以一个民用工厂的产能为代价，用六十天开垦土地、勘探矿藏。"
 hol_develop_slots:0 "扩展工业用地"
 hol_develop_slots_desc:0 "填海并平整工业用地。六十天后该州获得 3 个建筑位。"
 hol_develop_oil:0 "开发油田"
 hol_develop_oil_desc:0 "扩建巨港与打拉根的油田。九十天后该州获得 6 点石油。"
 hol_develop_steel:0 "扩建高炉"
 hol_develop_steel_desc:0 "在艾默伊登增建高炉产线，以进口矿砂与林堡焦炭为食。九十天后该州获得 5 点钢铁。"
 hol_develop_aluminium:0 "开采铝土矿"
 hol_develop_aluminium_desc:0 "开采苏里南的铝土矿床——美洲最富者。一百二十天后该州获得 6 点铝。"

 hol_onderdrukking:0 "殖民地管制"
 hol_onderdrukking_desc:0 "铁腕政策的延伸工具。"
 hol_koloniaal_beroep:0 "殖民地征兵"
 hol_koloniaal_beroep_desc:0 "从东印度征募辅助部队。"
 hol_politiestaat:0 "警察国家"
 hol_politiestaat_desc:0 "把殖民地的秩序交给军队。"

 hol_claims:0 "失落的商馆"
 hol_claims_desc:0 "公司账簿上那些被划掉的名字。"
 hol_claim_portugal:0 "索取葡萄牙帝国"
 hol_claim_portugal_desc:0 "里斯本的海外帝国——非洲、帝汶、澳门——经条约与赔偿转予开普领地，不论土地在谁手中。"
 hol_claim_handel:0 "重订特许状"
 hol_claim_handel_desc:0 "共和国重新颁发东印度贸易特许状。"

 hol_integratie:0 "南洋整合"
 hol_integratie_desc:0 "把征服的岛屿变成共和国的本土。"

 hol_vazal_integratie:0 "总督区整编"
 hol_vazal_integratie_desc:0 "把附庸国编入共和国的殖民体系。"
 hol_organiseer_vazallen:0 "整编总督区"
 hol_organiseer_vazallen_desc:0 "所有附庸国获得总督区地位，共和国获得额外工厂。"

 hol_guiana_aankoop:0 "购买圭亚那"
 hol_guiana_aankoop_desc:0 "用钱买，比用兵便宜。"
 hol_koop_guiana:0 "购买英属圭亚那"
 hol_koop_guiana_desc:0 "伦敦对埃塞奎博的掌控不过是形式；一笔款项便了结。无论世局如何，该地直接转归西印度公司。"
 hol_koop_frans_guiana:0 "购买法属圭亚那"
 hol_koop_frans_guiana_desc:0 "卡宴以一笔款项与一项承诺易手。该地直接转让，不论由谁驻守。"

 hol_lage_landen:0 "低地合并"
 hol_lage_landen_desc:0 "和平的道路，比战争更快。"
 hol_annex_luxemburg:0 "合并卢森堡"
 hol_annex_luxemburg_desc:0 "共主邦联的旧账，现在结清。"
 hol_annex_belgie:0 "合并比利时"
 hol_annex_belgie_desc:0 "一八三〇年的错误，用谈判纠正。"

 # ===== 事件 =====
 hol_republiek.20.t:0 "一八一五年的遗产"
 hol_republiek.20.d:0 "一百二十年前，维也纳的绅士们在地图上画了一条线，把北方和南方缝在一起，又在十五年后让它们裂开。海牙的档案柜里，那份缝合的文件还在。"
 hol_republiek.20.a:0 "读一读它。"

 hol_republiek.1.t:0 "第一次抉择：王冠的处置"
 hol_republiek.1.d:0 "制宪会议的第一个议题不是宪法，是一个人。威廉明娜已经离开海牙前往英国。现在的问题是：共和国该如何记住她——以叛国者，还是以失败者？"
 hol_republiek.1.a:0 "以叛国罪起诉她。"
 hol_republiek.1.b:0 "准她体面流亡。"

 hol_republiek.2.t:0 "第二次抉择：选举权"
 hol_republiek.2.d:0 "共和国需要定义「人民」。是每一个成年男女，还是每一个纳税的户主？十七世纪的共和国选了后者，一七九五年的人选了前者。"
 hol_republiek.2.a:0 "普选。一人一票。"
 hol_republiek.2.b:0 "财产资格。有产者投票。"

 hol_republiek.3.t:0 "第三次抉择：东印度的地位"
 hol_republiek.3.d:0 "东印度每年向海牙汇回的钱，比本土所有省份加起来还多。它是殖民地，是资产，还是共和国的一部分？"
 hol_republiek.3.a:0 "给它自治领地位。"
 hol_republiek.3.b:0 "继续由公司直辖。"

 hol_republiek.4.t:0 "制宪会议闭幕"
 hol_republiek.4.d:0 "三次表决结束。代表们走出会议厅时，海牙的钟声响了。共和国的面貌已经确定，剩下的只是把它写下来。"
 hol_republiek.4.a:0 "共和国万岁。"

 hol_republiek.5.t:0 "共和国宣告"
 hol_republiek.5.d:0 "议会援引一五八一年的《弃绝法案》，宣布王冠的特权失效。威廉明娜已在伦敦。荷兰再一次成为共和国——距离上一次，已经一百四十一年。"
 hol_republiek.5.a:0 "联省共和国，第二次。"

 hol_republiek.10.t:0 "摄政者的共和国"
 hol_republiek.10.d:0 "出钱的人接管了国家。阿姆斯特丹的银行家们坐进了议事厅，账本摊在桌上。这不是民主，但它运转得比民主快得多。"
 hol_republiek.10.a:0 "让账簿说话。"

 hol_republiek.11.t:0 "巴达维亚的黎明"
 hol_republiek.11.d:0 "共和国第一次属于每一个荷兰人。议会很吵，法案很慢，报纸每天都在骂政府——这正是它想要的样子。"
 hol_republiek.11.a:0 "让公民说话。"

