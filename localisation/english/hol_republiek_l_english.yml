 hol_limburg:0 "The Black Gold of Limburg"
 hol_limburg_desc:0 "Southern coal lights northern factories."

 hol_waterlinie:0 "The Water Line"
 hol_waterlinie_desc:0 "The Dutch wall is water."
 hol_vesting_holland:0 "Fortress Holland"
 hol_vesting_holland_desc:0 "The ring around Amsterdam, the last line."
 hol_staatse_troepen:0 "The States' Troops"
 hol_staatse_troepen_desc:0 "Maurice of Nassau's drill book, adopted once more."
 hol_grote_vlootwet:0 "The Great Fleet Law"
