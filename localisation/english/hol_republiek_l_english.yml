 hol_onderzeeboot:0 "The Submarine"
 hol_onderzeeboot_desc:0 "A small nation's great weapon."
 hol_indische_vloot:0 "The Indies Squadron"
 hol_indische_vloot_desc:0 "The fleet at Surabaya, the Republic's eastern anchor."
