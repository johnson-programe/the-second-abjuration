 # ===== v3 additions =====
 SUR_wic_gouverneur:0 "Governor-General of the West India Company"
 hol_wic_stichten:0 "The West India Company"
 hol_sticht_wic:0 "Grant the WIC Charter"
 hol_sticht_wic_desc:0 "Refound the West India Company as a Reichskommissariat-style governorate: Suriname and Curacao merged into one governorate paying tribute to The Hague."
 hol_zuid_afrika_koop:0 "South Africa"
 hol_koop_zuid_afrika:0 "Purchase South Africa"
 hol_koop_zuid_afrika_desc:0 "Pay a price Pretoria cannot refuse, and turn the Union of South Africa into a dominion of the Republic."
 hol_koloniaal_bestuur:0 "Colonial Affairs"
 hol_indie_requisitie:0 "Requisition from the Indies"
 hol_indie_requisitie_desc:0 "Ship raw materials out of Batavia in exchange for one factory's output at home."
 hol_indie_troepen:0 "Recruit in the Indies"
 hol_indie_troepen_desc:0 "Raise auxiliary troops in the East Indies for the duration of the war."
 hol_wic_olie:0 "Curacao Oil Quota"
 hol_wic_olie_desc:0 "Direct the output of the Curacao refinery to the metropole first."
 hol_gouverneur_ontslag:0 "Dismiss the Governor"
 hol_gouverneur_ontslag_desc:0 "The Hague can remove a disobedient governor outright — at the cost of colonial resentment."
 hol_kern_amerika:0 "Provincialise the Americas"
 hol_kern_amerika_desc:0 "Transfer every American possession to the West India Company and let it organise them into provinces."
 hol_wic_vazal_idea:0 "West India Company Governorate"
 hol_wic_vazal_idea_desc:0 "Suriname and Curacao merged into one governorate; resources, factories and docks flow to The Hague first."
 hol_indie_vazal_idea:0 "East Indies Governorate"
 hol_indie_vazal_idea_desc:0 "Batavia is governed by a governor-general, paying tribute and taking instructions from The Hague."
 hol_zuid_afrika_vazal_idea:0 "South African Dominion"
 hol_zuid_afrika_vazal_idea_desc:0 "Pretoria acknowledges The Hague's suzerainty; minerals and manpower open to the Republic."
 hol_republiek.40.t:0 "Pretoria's Reply"
 hol_republiek.40.d:0 "The Union cabinet did not refuse outright. They asked about the price rather than the principle — which, in diplomacy, usually means there is a deal to be made."
 hol_republiek.40.a:0 "Have the Treasury prepare an offer."
 hol_republiek.41.t:0 "The WIC Charter"
 hol_republiek.41.d:0 "A copy of the old charter is pulled from the bottom of a cupboard. It was never formally repealed — only forgotten. Now it can be made valid again."
 hol_republiek.41.a:0 "Reissue it."

 # ===== v6 additions =====
 hol_joint_indie_olie:0 "East Indies Oil Agreement"
