 # ===== v2 新增 =====
 hol_erfenis_1815:0 "The Legacy of 1815"
 hol_erfenis_1815_desc:0 "Vienna stitched the seven northern provinces, the ten southern ones and Luxembourg into one kingdom. A hundred and twenty years on, the seam still bleeds."
 hol_crisisjaren:0 "The Crisis Years"
 hol_crisisjaren_desc:0 "Gold standard, austerity, unemployment. The Hague believes the storm will pass if the ledger holds."
 hol_kroon:0 "The Crown and the States"
 hol_kroon_desc:0 "The Queen has begun appointing ministers over parliament's head. Nobody says it aloud; everyone hears the constitution crack."
