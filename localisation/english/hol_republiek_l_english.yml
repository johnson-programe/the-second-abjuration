 hol_organiseer_vazallen:0 "Reorganise the Governorates"
 hol_organiseer_vazallen_desc:0 "All puppets gain governorate status; the Republic gains extra factories."

 hol_guiana_aankoop:0 "Purchase the Guianas"
 hol_guiana_aankoop_desc:0 "Buying is cheaper than fighting."
 hol_koop_guiana:0 "Buy British Guiana"
 hol_koop_guiana_desc:0 "London needs cash; The Hague needs an estuary."
 hol_koop_frans_guiana:0 "Buy French Guiana"
 hol_koop_frans_guiana_desc:0 "Paris will not like it, but Paris is poor."

 hol_lage_landen:0 "Union of the Low Countries"
 hol_lage_landen_desc:0 "The peaceful road is faster than war."
 hol_annex_luxemburg:0 "Annex Luxembourg"
 hol_annex_luxemburg_desc:0 "The old personal union, settled at last."
 hol_annex_belgie:0 "Annex Belgium"
 hol_annex_belgie_desc:0 "Correct the mistake of 1830 by negotiation."

 # ===== Events =====
 hol_republiek.20.t:0 "The Legacy of 1815"
 hol_republiek.20.d:0 "One hundred and twenty years ago, the gentlemen of Vienna drew a line on a map, stitched north to south, and let it tear open again fifteen years later. The document is still in a cupboard in The Hague."
 hol_republiek.20.a:0 "Read it."

 hol_republiek.1.t:0 "The First Choice: The Crown"
 hol_republiek.1.d:0 "The convention's first item is not a constitution. It is a person. Wilhelmina has left The Hague for Britain. The question is how the Republic will remember her — as a traitor, or as a failure."
 hol_republiek.1.a:0 "Try her for treason."
 hol_republiek.1.b:0 "Let her go into dignified exile."

 hol_republiek.2.t:0 "The Second Choice: The Franchise"
 hol_republiek.2.d:0 "The Republic must define 'the people'. Every adult, or every householder who pays tax? The republic of the seventeenth century chose the latter; the men of 1795 chose the former."
 hol_republiek.2.a:0 "Universal suffrage. One man, one vote."
 hol_republiek.2.b:0 "A property qualification. Those who own, vote."

 hol_republiek.3.t:0 "The Third Choice: The Indies"
 hol_republiek.3.d:0 "The Indies sends home more money each year than all the home provinces combined. Is it a colony, an asset, or part of the Republic?"
 hol_republiek.3.a:0 "Give it dominion status."
 hol_republiek.3.b:0 "Keep it under direct Company rule."

 hol_republiek.4.t:0 "The Convention Closes"
 hol_republiek.4.d:0 "Three votes are done. As the delegates leave the chamber, the bells of The Hague begin to ring. The face of the Republic is settled; all that remains is to write it down."
 hol_republiek.4.a:0 "Long live the Republic."

 hol_republiek.5.t:0 "The Republic Is Proclaimed"
 hol_republiek.5.d:0 "Citing the Act of Abjuration of 1581, parliament declares the prerogatives of the Crown forfeit. Wilhelmina is already in London. The Netherlands is a republic once more — one hundred and forty-one years after the last one."
 hol_republiek.5.a:0 "The United Provinces, a second time."

 hol_republiek.10.t:0 "The Regents' Republic"
 hol_republiek.10.d:0 "Those who pay have taken the state. The bankers of Amsterdam sit in the council chamber with the ledgers open on the table. It is not democracy, but it moves far faster."
 hol_republiek.10.a:0 "Let the ledger speak."

 hol_republiek.11.t:0 "The Dawn of Batavia"
 hol_republiek.11.d:0 "For the first time the Republic belongs to every Dutchman. Parliament is loud, bills are slow, and the newspapers attack the government daily — which is exactly how it should be."
 hol_republiek.11.a:0 "Let the citizens speak."

