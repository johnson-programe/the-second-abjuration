 hol_franse_nederlanden_idea_desc:0 "Artois, French Flanders, Hainaut."
 hol_bourgondische_kreits_idea:0 "The Burgundian Circle"
 hol_bourgondische_kreits_idea_desc:0 "Never legally dissolved."
 hol_verenigde_nederlanden_idea:0 "The United Netherlands"
 hol_verenigde_nederlanden_idea_desc:0 "From the Scheldt to the Rhine."
 hol_vazal_staat_idea:0 "Governorate Status"
 hol_vazal_staat_idea_desc:0 "Governed by a governor; resources and factories flow to the metropole first."

 # ===== Decisions =====
 hol_ontwikkeling:0 "National Development"
 hol_ontwikkeling_desc:0 "Spend one civilian factory's output for sixty days to reclaim land or survey minerals."
 hol_develop_slots:0 "Reclaim the Noordoostpolder"
 hol_develop_slots_desc:0 "Dike and drain a new polder from the IJsselmeer, as the Zuiderzee Works have done since 1936. After sixty days the state gains 3 building slots."
 hol_develop_oil:0 "Develop the Oil Fields"
 hol_develop_oil_desc:0 "Expand the fields at Palembang and Tarakan. After ninety days the state gains 6 oil."
 hol_develop_steel:0 "Expand the Hoogovens"
 hol_develop_steel_desc:0 "Add a furnace line to the Royal Blast Furnaces at IJmuiden, founded in 1918 and firing since 1924. After ninety days the state gains 5 steel."
 hol_develop_aluminium:0 "Open the Bauxite Pits"
 hol_develop_aluminium_desc:0 "Work the Surinamese bauxite deposits, the richest in the Americas. After a hundred and twenty days the state gains 6 aluminium."

 hol_onderdrukking:0 "Colonial Control"
 hol_onderdrukking_desc:0 "Instruments of the iron hand."
 hol_koloniaal_beroep:0 "Colonial Recruitment"
 hol_koloniaal_beroep_desc:0 "Raise auxiliary troops in the Indies."
 hol_politiestaat:0 "Police State"
 hol_politiestaat_desc:0 "Hand colonial order to the army."

 hol_claims:0 "The Lost Factories"
 hol_claims_desc:0 "The names struck from the Company's ledger."
 hol_claim_portugal:0 "Claim the Portuguese Empire"
 hol_claim_portugal_desc:0 "Lisbon's overseas empire - Africa, Timor, Macau - is transferred to the Cape dominion by treaty and indemnity, whoever holds the soil."
 hol_claim_handel:0 "Renew the Charter"
 hol_claim_handel_desc:0 "The Republic reissues the East India trade charter."

 hol_integratie:0 "Integration of the South Seas"
 hol_integratie_desc:0 "Turn conquered islands into the Republic's homeland."

 hol_vazal_integratie:0 "Governorate Reform"
 hol_vazal_integratie_desc:0 "Fold the puppets into the Republic's colonial system."
 hol_organiseer_vazallen:0 "Reorganise the Governorates"
 hol_organiseer_vazallen_desc:0 "All puppets gain governorate status; the Republic gains extra factories."

 hol_guiana_aankoop:0 "Purchase the Guianas"
 hol_guiana_aankoop_desc:0 "Buying is cheaper than fighting."
 hol_koop_guiana:0 "Purchase British Guiana"
 hol_koop_guiana_desc:0 "London's hold on the Essequibo is a formality; a payment settles it. The territory passes to the West Indies Company whatever the state of the world."
 hol_koop_frans_guiana:0 "Purchase French Guiana"
 hol_koop_frans_guiana_desc:0 "Cayenne changes hands for a sum and a promise. The territory is transferred outright, regardless of who garrisons it."

 hol_lage_landen:0 "Union of the Low Countries"
 hol_lage_landen_desc:0 "The peaceful road is faster than war."
 hol_annex_luxemburg:0 "Annex Luxembourg"
 hol_annex_luxemburg_desc:0 "The old personal union, settled at last."
 hol_annex_belgie:0 "Annex Belgium"
 hol_annex_belgie_desc:0 "Correct the mistake of 1830 by negotiation."

 # ===== Events =====
 hol_republiek.20.t:0 "The Legacy of 1815"
 hol_republiek.20.d:0 "One hundred and twenty years ago, the gentlemen of Vienna drew a line on a map, stitched north to south, and let it tear open again fifteen years later. The document is still in a cupboard in The Hague."
 hol_republiek.20.a:0 "Read it."

 hol_republiek.1.t:0 "The First Choice: The Crown"
 hol_republiek.1.d:0 "The convention's first item is not a constitution. It is a person. Wilhelmina has left The Hague for Britain. The question is how the Republic will remember her — as a traitor, or as a failure."
 hol_republiek.1.a:0 "Try her for treason."
 hol_republiek.1.b:0 "Let her go into dignified exile."

 hol_republiek.2.t:0 "The Second Choice: The Franchise"
 hol_republiek.2.d:0 "The Republic must define 'the people'. Every adult, or every householder who pays tax? The republic of the seventeenth century chose the latter; the men of 1795 chose the former."
 hol_republiek.2.a:0 "Universal suffrage. One man, one vote."
 hol_republiek.2.b:0 "A property qualification. Those who own, vote."

 hol_republiek.3.t:0 "The Third Choice: The Indies"
 hol_republiek.3.d:0 "The Indies sends home more money each year than all the home provinces combined. Is it a colony, an asset, or part of the Republic?"
 hol_republiek.3.a:0 "Give it dominion status."
 hol_republiek.3.b:0 "Keep it under direct Company rule."

 hol_republiek.4.t:0 "The Convention Closes"
 hol_republiek.4.d:0 "Three votes are done. As the delegates leave the chamber, the bells of The Hague begin to ring. The face of the Republic is settled; all that remains is to write it down."
 hol_republiek.4.a:0 "Long live the Republic."

 hol_republiek.5.t:0 "The Republic Is Proclaimed"
 hol_republiek.5.d:0 "Citing the Act of Abjuration of 1581, parliament declares the prerogatives of the Crown forfeit. Wilhelmina is already in London. The Netherlands is a republic once more — one hundred and forty-one years after the last one."
 hol_republiek.5.a:0 "The United Provinces, a second time."

 hol_republiek.10.t:0 "The Regents' Republic"
 hol_republiek.10.d:0 "Those who pay have taken the state. The bankers of Amsterdam sit in the council chamber with the ledgers open on the table. It is not democracy, but it moves far faster."
 hol_republiek.10.a:0 "Let the ledger speak."

 hol_republiek.11.t:0 "The Dawn of Batavia"
 hol_republiek.11.d:0 "For the first time the Republic belongs to every Dutchman. Parliament is loud, bills are slow, and the newspapers attack the government daily — which is exactly how it should be."
 hol_republiek.11.a:0 "Let the citizens speak."

 # ===== Characters =====
 HOL_van_beuningen:0 "Daniël George van Beuningen"
 HOL_albarda:0 "Johan Willem Albarda"
 hol_rep_winkelman:0 "Henri Winkelman"
 hol_rep_reijnders:0 "Izaak Reijnders"
 hol_rep_helfrich:0 "Conrad Helfrich"

 # ===== Country names =====
 HOL_REP:0 "United Provinces of the Netherlands"
 HOL_REP_DEF:0 "the United Provinces of the Netherlands"
 HOL_REP_ADJ:0 "Dutch"
 hol_waterlinie_bonus:0 "Water Line Doctrine"
 hol_onderzeeboot_bonus:0 "Submarine Warfare"

 # ===== v2 新增 =====
 hol_erfenis_1815:0 "The Legacy of 1815"
 hol_erfenis_1815_desc:0 "The Kingdom born at Vienna was a compromise: a northern and a southern people yoked to one crown, and a colonial empire governed from The Hague. A century later the compromise has worn thin. The Republic inherits the kingdom's debts, its fleet, its colonies - and the question of what to do with all three."
 hol_crisisjaren:0 "The Crisis Years"
 hol_crisisjaren_desc:0 "The crash of 1929 emptied the warehouses of Rotterdam and threw a third of the dockside into relief. The old liberal consensus of thrift and free trade has nothing left to say. In the debating halls of the provinces, men are beginning to ask whether the monarchy itself is part of the problem."
 hol_kroon:0 "The Crown and the States"
 hol_kroon_desc:0 "The crown has become an embarrassment. It signs what the cabinet writes, opens the States-General with a speech it did not compose, and is blamed for every failed harvest and closed factory. In the salons of The Hague the talk is no longer whether the monarchy will fall, but who will be standing when it does."
 hol_conventie:0 "The Constitutional Convention"
 hol_conventie_desc:0 "Delegates are summoned to The Hague: regents and shipowners, predikants and schoolmasters, dockworkers and colonial officials. Their task is nothing less than to write a constitution for a state that does not yet exist. Every article will be a compromise, and every compromise will have enemies."
 hol_uitroeping:0 "Proclamation of the Republic"
 hol_uitroeping_desc:0 "On the steps of the Binnenhof the instrument is read aloud, and the Batavian oath of 1795 is answered at last by a second abjuration. The stadtholder's house is closed, the flag of the Republic is run up over the Noordeinde, and the envoys of Europe are informed that the United Provinces have resumed their seat among the powers."
 hol_gezicht:0 "The Face of the Republic"
 hol_gezicht_desc:0 "A union of shareholders, or a union of citizens?"
 hol_ware_vrijheid:0 "True Freedom"
 hol_ware_vrijheid_desc:0 "De Witt's old words: only a republic without a stadtholder is free."
 hol_heren_xvii:0 "The Gentlemen Seventeen"
 hol_heren_xvii_desc:0 "The Company's directors take their seats in the council chamber again. This time they govern a country."
 hol_wisselbank:0 "The Exchange Bank"
 hol_wisselbank_desc:0 "The Exchange Bank of Amsterdam is reformed and its reserves opened to the state. Credit is the Republic's true army: with a sound guilder the Council can borrow at three per cent while its enemies pay seven, and finance a war without raising a single new tax."
 hol_compagnie_staat:0 "The Company Is the State"
 hol_compagnie_staat_desc:0 "The Company is not a state, but it governs one: it raises troops, strikes coin, concludes treaties with native princes and pays dividends to shareholders in Amsterdam. The Council debates whether to nationalise it, dissolve it, or simply admit what everyone knows - that the Republic's empire is a private enterprise with a public flag."
 hol_gouden_eeuw:0 "The Return of the Golden Age"
 hol_gouden_eeuw_desc:0 "The warehouses are full, the bourses are loud, and the painters have more commissions than they can fill. For the first time since the seventeenth century the Republic is not merely surviving but prospering - and prosperity, as the regents well know, always attracts predators."
 hol_vroedschap:0 "The Vroedschap Restored"
 hol_vroedschap_desc:0 "The cities return to self-perpetuating town councils."
 hol_aandeel_stem:0 "Shares and Votes"
 hol_aandeel_stem_desc:0 "The franchise follows property. The old rule of the Republic."
 hol_mare_liberum:0 "Mare Liberum"
 hol_mare_liberum_desc:0 "Grotius' law: free ship, free goods."
 hol_neutraliteit:0 "Armed Neutrality"
 hol_neutraliteit_desc:0 "No alliances, but armed to the teeth. Neutrality is a business."
 hol_soldij:0 "The Payroll"
 hol_soldij_desc:0 "The Republic does not conscript citizens. It hires soldiers."
 hol_bataafse_grondwet:0 "The Batavian Constitution"
 hol_bataafse_grondwet_desc:0 "The constitution of 1798 comes out of the archive. This time it will not be torn up."
 hol_een_man_een_stem:0 "One Man, One Vote"
 hol_een_man_een_stem_desc:0 "Finish what 1917 and 1919 left unfinished."
 hol_nationale_vergadering:0 "The National Assembly"
 hol_nationale_vergadering_desc:0 "One nation, one chamber, one vote."
 hol_zuilen_vallen:0 "The Pillars Fall"
 hol_zuilen_vallen_desc:0 "Protestant, Catholic, Socialist, Liberal — every pillar comes down."
 hol_dageraad:0 "The Dawn of Batavia"
 hol_dageraad_desc:0 "For the first time the Republic belongs to every Dutchman."
 hol_maatschappelijk_verdrag:0 "The Social Contract"
 hol_maatschappelijk_verdrag_desc:0 "From cradle to grave, the state carries you."
 hol_burgerschool:0 "The Citizens' School"
 hol_burgerschool_desc:0 "Education is not a matter for the sects but for the Republic."
 hol_volksleger:0 "The People's Army"
 hol_volksleger_desc:0 "Every citizen a soldier, every soldier a citizen."
 hol_klasseloos:0 "The Classless Netherlands"
 hol_klasseloos_desc:0 "No subjects, only citizens."
 hol_volksdemocratie:0 "People's Democracy"
 hol_volksdemocratie_desc:0 "The example travels further than the fleet."
 hol_eigen_koers:0 "A Course of Our Own"
 hol_eigen_koers_desc:0 "The Republic joins no one's bloc. It founds its own."
 hol_gezanten:0 "Permanent Envoys"
 hol_gezanten_desc:0 "The Republic's envoys are received at every court in Europe, from Copenhagen to Lisbon. Their instructions are simple: no permanent alliances, no foreign garrisons, and no treaty that cannot be paid for in guilders. It is an old policy, and it has kept the Republic alive for three centuries."
 hol_neutrale_liga:0 "The Neutral League"
 hol_neutrale_liga_desc:0 "Stockholm, Copenhagen, Oslo, Bern — the states that also refuse to choose."
 hol_zusterrepublieken:0 "Sister Republics"
 hol_zusterrepublieken_desc:0 "There are other republics in Europe, and the Republic has begun to count them. Switzerland, Venice's ghost, the German free cities, the new states of the Baltic - all of them small, all of them trading, all of them afraid of the same great powers. A league of sister republics would be a league of survivors."
 hol_hanze_akkoord:0 "The Hanseatic Accord"
 hol_hanze_akkoord_desc:0 "The old North Sea and Baltic trade route, reconnected by a new treaty."
 hol_zuid_afrika:0 "Kin in South Africa"
 hol_zuid_afrika_desc:0 "The Cape was Dutch before it was British, and the Republic has not forgotten. The dominion is reorganised as a Dutch Africa: Afrikaans recognised in the courts, Dutch capital in the mines, and the fleet given a base at Saldanha Bay on the road to the Indies."
 hol_koloniaal_blok:0 "The Colonial Bloc"
 hol_koloniaal_blok_desc:0 "The colonial powers of Europe are invited to The Hague: not to divide the world, but to keep it. Tariffs, shipping lanes, the treatment of native labour and the common defence of the tropics are placed on the table. Madrid and Lisbon, clinging to the last of their empires, are offered a chair and a guarantee."
 hol_wereldhaven:0 "The World Port"
 hol_wereldhaven_desc:0 "Rotterdam is dredged, the Maasvlakte surveyed, the Rhine barges given a deep-water berth. Within a decade the port handles more tonnage than any in Europe, and the Republic collects a toll on every crate that passes from the Ruhr to the Atlantic. Neutrality, it turns out, is a business."
 hol_wic:0 "The West India Company Reborn"
 hol_wic_desc:0 "The West India Company is chartered again, this time by the Republic itself. Its charter runs from the Scheldt to the Orinoco: the sugar of Suriname, the salt of Curaçao, the bauxite that will one day be worth more than both. The Company's directors are given a fleet and told not to lose it."
 hol_suriname_bauxiet:0 "Surinamese Bauxite"
 hol_suriname_bauxiet_desc:0 "Bauxite is worth more than gold."
 hol_curacao:0 "The Curaçao Refinery"
 hol_curacao_desc:0 "Venezuelan crude, Curaçao towers."
 hol_guiana:0 "The Guianas"
 hol_guiana_desc:0 "Three Guianas: Dutch, British, French. Only one is ours."
 hol_guiana_vazal:0 "The Guiana Governorate"
 hol_guiana_vazal_desc:0 "Guiana becomes a governorate paying tribute to the Republic."
 hol_zuid_amerika:0 "The South American Mainland"
 hol_zuid_amerika_desc:0 "Venezuela and Colombia lie just west of Guiana."
 hol_latijns_amerika:0 "Latin America"
 hol_latijns_amerika_desc:0 "From Panama to the Plata, one governorate after another."
 hol_scheuring:0 "The Schism"
 hol_scheuring_desc:0 "The southern provinces have never accepted the settlement of 1839, and the Republic has never accepted the loss of them. To speak of the Split Wound is to reopen a century of grievance: the Scheldt tolls, the Catholic question, the Walloon coal that fed Dutch furnaces before the revolt. What was torn apart can be sewn together again."
 hol_zeventien:0 "The Seventeen Provinces"
 hol_zeventien_desc:0 "The old name returns to the maps: the Seventeen Provinces, from Groningen to Artois. The clerks of the Republic redraw the provincial boundaries, restore the ancient seats to the States, and quietly prepare the legal instruments by which the southern provinces will be received back into the Union."
 hol_luxemburg:0 "Luxembourg"
 hol_luxemburg_desc:0 "The Grand Duchy was carved out of the old Burgundian inheritance by men who had never seen it. Its fortress was dismantled in 1867, its language suppressed in 1839, and its people have been passed between crowns like a mortgage. The Republic offers them what Vienna never did: a place in the Union."
 hol_belgie:0 "Belgium"
 hol_belgie_desc:0 "Brussels is not conquered but received. The southern provinces are offered the same terms as 1579: their own States, their own privileges, their own language, in exchange for the oath and the fleet. The great works at Liège and Charleroi are surveyed, and Dutch engineers begin to draft the canal that will bind the Scheldt to the Meuse."
 hol_bourgondie:0 "The Burgundian Governorate"
 hol_bourgondie_desc:0 "The ten southern provinces are no longer a kingdom but a governorate, paying into the Republic's counting house."
 hol_rijnrepubliek:0 "The Rhine Republic"
 hol_rijnrepubliek_desc:0 "Across the Rhine the old ecclesiastical electorates and the Ruhr valley lie open. A Rhenish Republic, neutral, demilitarised and economically bound to Amsterdam, would give the Republic a buffer and a market at once. The German states are weak, the French are distracted, and the river is wide."
 hol_tweede_tiendaagse:0 "The Second Ten Days' Campaign"
 hol_tweede_tiendaagse_desc:0 "The campaign of 1831 lasted ten days. This one will not be so short."
 hol_franse_nederlanden:0 "The French Netherlands"
 hol_franse_nederlanden_desc:0 "Artois, Cambrai, and the old Burgundian lands of the south were Dutch before they were French. The Republic does not ask for them - it publishes the medieval charters, the toll registers, the old maps, and lets the lawyers do the work that the army will finish."
 hol_verenigde_nederlanden:0 "The United Netherlands"
 hol_verenigde_nederlanden_desc:0 "The work of 1579 is completed at last: north and south, polder and walloon valley, bound in one United Netherlands. The States-General sits in The Hague, the stadtholder's palace is a museum, and the flag that flies from Batavia to Paramaribo carries seventeen provinces in its folds."
 hol_groot_oost_indie:0 "Greater East Indies"
 hol_groot_oost_indie_desc:0 "The East Indies are not a colony but a continent of islands, and the Republic has decided to govern them as one. A Governor-General is appointed at Batavia with authority over Java, Sumatra, Borneo and the Outer Islands, and the KNIL is expanded into a colonial army capable of holding them."
 hol_verloren_factorijen:0 "The Lost Factories"
 hol_verloren_factorijen_desc:0 "Malacca, Ceylon, the Cape, Formosa. What the Company lost, the Republic takes back."
 hol_indische_federatie:0 "The Indies Federation"
 hol_indische_federatie_desc:0 "The Indies is no longer a colony but a federation sharing one crown with the Republic."
 hol_kern_azie:0 "Provincialise the Indies"
 hol_kern_azie_desc:0 "Core every Asian possession of the Republic."
 hol_gezanten_idea:0 "Permanent Envoys"
 hol_gezanten_idea_desc:0 "A small nation's voice is carried by its people."
 hol_neutrale_liga_idea:0 "The Neutral League"
 hol_neutrale_liga_idea_desc:0 "No side chosen, but mutual guarantees."
 hol_zusterrepublieken_idea:0 "Sister Republics"
 hol_zusterrepublieken_idea_desc:0 "Natural allies among the democracies."
 hol_hanze_akkoord_idea:0 "The Hanseatic Accord"
 hol_hanze_akkoord_idea_desc:0 "Old routes, new treaty."
 hol_zuid_afrika_idea:0 "Kin in South Africa"
 hol_zuid_afrika_idea_desc:0 "One language, one memory."
 hol_koloniaal_blok_idea:0 "The Colonial Bloc"
 hol_koloniaal_blok_idea_desc:0 "Empires abroad fear the same predators."
 hol_wereldhaven_idea:0 "The World Port"
 hol_wereldhaven_idea_desc:0 "Europe's goods leave through Rotterdam."
 hol_bourgondie_idea:0 "The Burgundian Governorate"
 hol_bourgondie_idea_desc:0 "The southern provinces fly the Republic's flag again."
 hol_bourgondische_vazal_idea:0 "Burgundian Status"
 hol_bourgondische_vazal_idea_desc:0 "Governed by a governor; resources and factories flow to The Hague first."
 hol_rijnrepubliek_idea:0 "The Rhine Republic"
 hol_rijnrepubliek_idea_desc:0 "A sister republic on the Rhine."
 hol_rijn_vazal_idea:0 "Rhenish Status"
 hol_rijn_vazal_idea_desc:0 "Rhine coal and steel pass through Rotterdam first."
 hol_indische_federatie_idea:0 "The Indies Federation"
 hol_indische_federatie_idea_desc:0 "A federation under one crown."
