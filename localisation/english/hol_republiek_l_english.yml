 # ===== v3 additions =====
 SUR_wic_gouverneur:0 "Governor-General of the West India Company"
 hol_wic_stichten:0 "The West India Company"
 hol_sticht_wic:0 "Grant the WIC Charter"
 hol_sticht_wic_desc:0 "Refound the West India Company as a Reichskommissariat-style governorate: Suriname and Curacao merged into one governorate paying tribute to The Hague."
 hol_zuid_afrika_koop:0 "South Africa"
 hol_koop_zuid_afrika:0 "Purchase South Africa"
 hol_koop_zuid_afrika_desc:0 "Pay a price Pretoria cannot refuse, and turn the Union of South Africa into a dominion of the Republic."
 hol_koloniaal_bestuur:0 "Colonial Affairs"
 hol_indie_requisitie:0 "Requisition from the Indies"
 hol_indie_requisitie_desc:0 "Ship raw materials out of Batavia in exchange for one factory's output at home."
 hol_indie_troepen:0 "Recruit in the Indies"
 hol_indie_troepen_desc:0 "Raise auxiliary troops in the East Indies for the duration of the war."
 hol_wic_olie:0 "Curacao Oil Quota"
 hol_wic_olie_desc:0 "Direct the output of the Curacao refinery to the metropole first."
 hol_gouverneur_ontslag:0 "Dismiss the Governor"
 hol_gouverneur_ontslag_desc:0 "The Hague can remove a disobedient governor outright — at the cost of colonial resentment."
 hol_kern_amerika:0 "Provincialise the Americas"
 hol_kern_amerika_desc:0 "Transfer every American possession to the West India Company and let it organise them into provinces."
 hol_wic_vazal_idea:0 "West India Company Governorate"
 hol_wic_vazal_idea_desc:0 "Suriname and Curacao merged into one governorate; resources, factories and docks flow to The Hague first."
 hol_indie_vazal_idea:0 "East Indies Governorate"
 hol_indie_vazal_idea_desc:0 "Batavia is governed by a governor-general, paying tribute and taking instructions from The Hague."
 hol_zuid_afrika_vazal_idea:0 "South African Dominion"
 hol_zuid_afrika_vazal_idea_desc:0 "Pretoria acknowledges The Hague's suzerainty; minerals and manpower open to the Republic."
 hol_republiek.40.t:0 "Pretoria's Reply"
 hol_republiek.40.d:0 "The Union cabinet did not refuse outright. They asked about the price rather than the principle — which, in diplomacy, usually means there is a deal to be made."
 hol_republiek.40.a:0 "Have the Treasury prepare an offer."
 hol_republiek.41.t:0 "The WIC Charter"
 hol_republiek.41.d:0 "A copy of the old charter is pulled from the bottom of a cupboard. It was never formally repealed — only forgotten. Now it can be made valid again."
 hol_republiek.41.a:0 "Reissue it."

 # ===== v6 additions =====
 hol_joint_indie_olie:0 "East Indies Oil Agreement"
 hol_joint_indie_olie_desc:0 "Crude from Palembang and Tarakan goes to the metropole first."
 hol_joint_indie_leger:0 "Joint Defence of the Indies"
 hol_joint_indie_leger_desc:0 "The KNIL and the home army share one establishment and one drill book."
 hol_joint_wic_olie:0 "Curacao Refining Agreement"
 hol_joint_wic_olie_desc:0 "The Curacao towers fuel the Republic's fleet and factories."
 hol_joint_wic_vloot:0 "West Indies Squadron"
 hol_joint_wic_vloot_desc:0 "A squadron headquarters at Willemstad."
 hol_joint_zuid_afrika:0 "The Hague-Pretoria Agreement"
 hol_joint_zuid_afrika_desc:0 "South African minerals and manpower open to the Republic, in exchange for full internal self-government."
 hol_joint_luchtvaart:0 "Imperial Aviation Agreement"
 hol_joint_luchtvaart_desc:0 "A route from Amsterdam via Batavia to Cape Town."
 hol_dividend_burgundy_idea:0 "Burgundian Dividend"
 hol_dividend_burgundy_idea_desc:0 "Coal and steel from the southern provinces settle into The Hague's counting house each quarter."
 hol_dividend_rhine_idea:0 "Rhenish Dividend"
 hol_dividend_rhine_idea_desc:0 "Rhenish industrial output passes through Rotterdam first."
 hol_dividend_wic_idea:0 "West Indian Dividend"
 hol_dividend_wic_idea_desc:0 "Surinamese bauxite and Curacao refining count toward the Republic's dividend."
 hol_dividend_indie_idea:0 "East Indian Dividend"
 hol_dividend_indie_idea_desc:0 "Indies resources and factories remit a fixed share under the charter."
 hol_dividend_sa_idea:0 "South African Dividend"
 hol_dividend_sa_idea_desc:0 "Rand gold and coal open to The Hague."
 hol_joint_indie_olie_idea:0 "Oil Agreement"
 hol_joint_indie_olie_idea_desc:0 "Crude flows north first, in exchange for manufactured goods."
 hol_joint_leger_idea:0 "Joint Defence"
 hol_joint_leger_idea_desc:0 "One establishment, one drill book, Hague inspectors."
 hol_joint_wic_olie_idea:0 "Refining Agreement"
 hol_joint_wic_olie_idea_desc:0 "Refinery output goes to the metropole first."
 hol_joint_vloot_idea:0 "Squadron"
 hol_joint_vloot_idea_desc:0 "Willemstad becomes the Republic's Caribbean anchorage."
 hol_joint_sa_idea:0 "Dominion Agreement"
 hol_joint_sa_idea_desc:0 "Minerals and manpower open; internal affairs self-governing."
 hol_joint_luchtvaart_idea:0 "Imperial Route"
 hol_joint_luchtvaart_idea_desc:0 "Amsterdam — Batavia — Cape Town."
 hol_joint_rijksdag_idea:0 "Imperial Diet"
 hol_joint_rijksdag_idea_desc:0 "A standing body where metropole and dominion deliberate together."
 hol_joint_raad_idea:0 "Joint Colonial Council"
 hol_joint_raad_idea_desc:0 "A standing consultative body between metropole and colonies."
 hol_autonomy_tt:0 "Autonomy"
 hol_joint_rijksdag:0 "Imperial Diet"
 HOL_AFRICA:0 "Dutch Africa"
 HOL_AFRICA_DEF:0 "Dutch Africa"
 HOL_AFRICA_ADJ:0 "South African"
 hol_ins_politiek:0 "Indies Council"
 hol_ins_expansie:0 "Indies Expansion"
 hol_ins_kern:0 "Provincialise the Indies"
 hol_sur_politiek:0 "Governorate Council"
 hol_sur_expansie:0 "West Indian Expansion"
 hol_sur_kern:0 "Provincialise the West Indies"
 hol_saf_politiek:0 "Dominion Parliament"
 hol_saf_expansie:0 "South African Expansion"
 hol_saf_kern:0 "Provincialise Africa"
 hol_joint_rijksdag_desc:0 "The Republic, its governorates and its dominion form a standing imperial diet."
 hol_ins_politiek_desc:0 "A political agreement: the colonial councils gain seats, and obligations."
 hol_ins_kern_desc:0 "A provincial decree: newly conquered land is no longer occupied territory but a province of the Republic."
 hol_ins_expansie_desc:0 "An expansion agreement: where to go next is decided jointly."
 hol_sur_politiek_desc:0 "A political agreement: the colonial councils gain seats, and obligations."
 hol_sur_kern_desc:0 "A provincial decree: newly conquered land is no longer occupied territory but a province of the Republic."
 hol_sur_expansie_desc:0 "An expansion agreement: where to go next is decided jointly."
 hol_saf_politiek_desc:0 "A political agreement: the colonial councils gain seats, and obligations."
 hol_saf_kern_desc:0 "A provincial decree: newly conquered land is no longer occupied territory but a province of the Republic."
 hol_saf_expansie_desc:0 "An expansion agreement: where to go next is decided jointly."
 hol_koloniaal_dividend_idea:0 "Colonial Dividend"
 hol_koloniaal_dividend_idea_desc:0 "Governorate output is settled quarterly and remitted to The Hague as factories and raw materials."
 hol_holland_idea:0 "Holland"
 hol_holland_idea_desc:0 "The capital, docks and banks of Amsterdam and Rotterdam are the heart of the Republic."
 hol_gelderland_idea:0 "Gelderland"
 hol_gelderland_idea_desc:0 "The farms and recruiting grounds of the eastern provinces supply the Republic's army."
 hol_friesland_idea:0 "Friesland"
 hol_friesland_idea_desc:0 "The pastures and shipping of the northern provinces keep the cost of living down."
 hol_republiek.50.t:0 "The Joint Council Opens"
 hol_republiek.50.d:0 "Delegates from Batavia, Paramaribo and Pretoria enter the council chamber at The Hague. They have not come to be instructed. They have come to bargain."
 hol_republiek.50.a:0 "Give them seats."
 hol_republiek.51.t:0 "The Imperial Diet Convenes"
 hol_republiek.51.d:0 "Under the Republic's flag, governorates and dominion sit at one long table as equals for the first time."
 hol_republiek.51.a:0 "Enter it into the record."
 hol_republiek.52.t:0 "A Provincial Decree"
 hol_republiek.52.d:0 "New land is drawn into the Republic. The cartographers work through the night, turning dotted occupation lines into solid borders."
 hol_republiek.52.a:0 "Draw it in."
 hol_republiek.60.t:0 "The WIC Charter"
 hol_republiek.60.d:0 "The old charter has lain at the bottom of a cupboard for a hundred and forty years. Today it is stamped back into force: Suriname and Curacao are governed by the Company, paying tribute to The Hague."
 hol_republiek.60.a:0 "Stamp it."
 hol_republiek.61.t:0 "The Union of the Southern Provinces"
 hol_republiek.61.d:0 "The Brussels chamber passes the union by a narrow majority. The mill owners of Liege and the dockers of Antwerp both look to The Hague, wondering what they are now."
 hol_republiek.61.a:0 "Make them citizens."
 hol_republiek.62.t:0 "Pretoria Signs"
 hol_republiek.62.d:0 "The Union cabinet signs. Rand gold and Cape dockyards open to the Republic — at the price of a promise not to touch their domestic affairs."
 hol_republiek.62.a:0 "Enter it in the ledger."
 hol_republiek.63.t:0 "Lisbon's Colonies Change Hands"
 hol_republiek.63.d:0 "Lisbon can no longer hold Goa, Timor or Mozambique. They are handed to Pretoria — trusteeship in name, permanent in fact."
 hol_republiek.63.a:0 "Take them over."
 hol_republiek.70.t:0 "The Funeral of the Gold Standard"
 hol_republiek.70.d:0 "On 26 September The Hague abandons the gold standard. Colijn writes one line in his diary: 'What we defended for five years was gone overnight.'"
 hol_republiek.70.a:0 "Enter it into the record."
 hol_republiek.71.t:0 "The Crown Steps Over"
 hol_republiek.71.d:0 "The Queen summons three ministers directly, bypassing parliament. The constitution does not forbid it. Everyone knows the line has been crossed."
 hol_republiek.71.a:0 "Enter it into the record."
 hol_republiek.72.t:0 "A Convention Without a Crown"
 hol_republiek.72.d:0 "In the chamber at The Hague the chair is empty. For the first time in a hundred and fifty years, no one sits there on behalf of the Crown."
 hol_republiek.72.a:0 "Enter it into the record."
 hol_republiek.73.t:0 "The Stadtholderate Abolished"
 hol_republiek.73.d:0 "When the vote is read out the chamber falls silent for a moment. Then someone stands and takes the Orange flag down from the wall."
 hol_republiek.73.a:0 "Enter it into the record."
 hol_republiek.74.t:0 "The Gentlemen Seventeen"
 hol_republiek.74.d:0 "The Company's directors take their seats again. What they bring is not a draft constitution but a ledger."
 hol_republiek.74.a:0 "Enter it into the record."
 hol_republiek.75.t:0 "The Text of 1798"
 hol_republiek.75.d:0 "It takes the archivist three days to find the constitution. The paper has yellowed, but the articles are still legible."
 hol_republiek.75.a:0 "Enter it into the record."
 hol_republiek.76.t:0 "The Pillars Come Down"
 hol_republiek.76.d:0 "Protestant, Catholic, Socialist, Liberal — all four come down in the same week. For the first time people do not know which camp their neighbour belongs to."
 hol_republiek.76.a:0 "Enter it into the record."
 hol_republiek.77.t:0 "The Union Is Founded"
 hol_republiek.77.d:0 "The Hague sends invitations to every capital still willing to hear a small nation. More replies come back than expected."
 hol_republiek.77.a:0 "Enter it into the record."
 hol_republiek.78.t:0 "The WIC Charter"
 hol_republiek.78.d:0 "The charter is pulled from the bottom of a cupboard. It was never formally repealed — only forgotten."
 hol_republiek.78.a:0 "Enter it into the record."
 hol_republiek.79.t:0 "The Three Guianas"
 hol_republiek.79.d:0 "Dutch, British, French. Three colours on the map, three languages, one river mouth."
 hol_republiek.79.a:0 "Enter it into the record."
 hol_republiek.80.t:0 "1579, 1648, 1830"
 hol_republiek.80.d:0 "Three tears, none of them healed. The originals of every treaty sit in the archive at The Hague."
 hol_republiek.80.a:0 "Enter it into the record."
 hol_republiek.81.t:0 "The Ten Southern Provinces"
 hol_republiek.81.d:0 "The Brussels papers call the union 'a correction long overdue'. The dockers of Antwerp are discussing wages."
 hol_republiek.81.a:0 "Enter it into the record."
 hol_republiek.82.t:0 "Artois and Flanders"
 hol_republiek.82.d:0 "Two provinces ceded in 1659 and 1678 still carry their old borders on the map. Now they are drawn back."
 hol_republiek.82.a:0 "Enter it into the record."
 hol_republiek.83.t:0 "The Low Countries, Whole"
 hol_republiek.83.d:0 "From the Scheldt to the Rhine, from the North Sea to the Ardennes. A four-hundred-year crack closes on this day."
 hol_republiek.83.a:0 "Enter it into the record."
 hol_republiek.84.t:0 "The Borders of the South Seas"
 hol_republiek.84.d:0 "Orders reach the map room at The Hague: draw the eastern border as far as it can be drawn."
 hol_republiek.84.a:0 "Enter it into the record."
 hol_republiek.85.t:0 "Provincialising the Indies"
 hol_republiek.85.d:0 "The new provinces are sealed. Governorate paperwork now uses the same format as the home provinces."
 hol_republiek.85.a:0 "Enter it into the record."
 hol_republiek.90.t:0 "The Factory Opens"
 hol_republiek.90.d:0 "A new chimney rises over the polder. The engineers say it is the first rolling mill in the country built below sea level."
 hol_republiek.90.a:0 "Continue."
 hol_republiek.91.t:0 "Lisbon Hands Over"
 hol_republiek.91.d:0 "Goa, Timor, Mozambique — three instruments signed on the same day. Lisbon's representative does not attend."
 hol_republiek.91.a:0 "Continue."
 hol_republiek.92.t:0 "Provincialising the Americas"
 hol_republiek.92.d:0 "A whole new row of provincial files appears in the cabinet at Paramaribo."
 hol_republiek.92.a:0 "Continue."


# ===== Auto-generated completion events (v14) =====
 hol_republiek.86.t:0 "The Exchange Bank"
 hol_republiek.86.d:0 "Amsterdam's Wisselbank reopens its doors. Bills of exchange clear in guilders again, and the Republic's credit stands above every monarch's."
 hol_republiek.86.a:0 "Enter it into the record."
 hol_republiek.87.t:0 "The Company Is the State"
 hol_republiek.87.d:0 "The charter is rewritten so the Republic holds the Company's shares directly. The Provinces are shareholders; parliament is the general meeting."
 hol_republiek.87.a:0 "Enter it into the record."
 hol_republiek.88.t:0 "The Return of the Golden Age"
 hol_republiek.88.d:0 "The merchant houses report profits not seen since the 1660s. For the first time the ledger beats the old century."
 hol_republiek.88.a:0 "Enter it into the record."
 hol_republiek.89.t:0 "The Vroedschap Restored"
 hol_republiek.89.d:0 "The self-perpetuating city councils reconvene. The regent class is back in its accustomed seats, and the Republic looks like itself again."
 hol_republiek.89.a:0 "Enter it into the record."
 hol_republiek.93.t:0 "Shares and Votes"
 hol_republiek.93.d:0 "The franchise follows taxable wealth, as in the old Republic. Those who hold the country hold the vote."
 hol_republiek.93.a:0 "Enter it into the record."
 hol_republiek.94.t:0 "Mare Liberum"
 hol_republiek.94.d:0 "Grotius' doctrine is reissued as state policy: free ship, free goods. The fleet is ordered to protect passage, not to plunder it."
 hol_republiek.94.a:0 "Enter it into the record."
 hol_republiek.95.t:0 "Armed Neutrality"
 hol_republiek.95.d:0 "No alliances, but armed to the teeth. Neutrality is declared a business, and the Republic means to stay in it."
 hol_republiek.95.a:0 "Enter it into the record."
 hol_republiek.96.t:0 "The Payroll"
 hol_republiek.96.d:0 "The Republic does not conscript citizens; it hires soldiers. Regiments of the payroll march under the States' colours."
 hol_republiek.96.a:0 "Enter it into the record."
 hol_republiek.97.t:0 "One Man, One Vote"
 hol_republiek.97.d:0 "The unfinished work of 1917 and 1919 is closed. The vote is extended to every adult citizen, without distinction of sex or class."
 hol_republiek.97.a:0 "Enter it into the record."
 hol_republiek.98.t:0 "The National Assembly"
 hol_republiek.98.d:0 "One nation, one chamber, one vote. The Estates are dissolved into a single elected assembly sitting at The Hague."
 hol_republiek.98.a:0 "Enter it into the record."
 hol_republiek.99.t:0 "The Dawn of Batavia"
 hol_republiek.99.d:0 "For the first time the Republic belongs to every Dutchman, not to a dynasty across the sea. The dawn breaks over Batavia and Amsterdam alike."
 hol_republiek.99.a:0 "Enter it into the record."
 hol_republiek.100.t:0 "The Social Contract"
 hol_republiek.100.d:0 "From cradle to grave the state carries the citizen. A compact of welfare is written into the Republic's law."
 hol_republiek.100.a:0 "Enter it into the record."
 hol_republiek.101.t:0 "The Citizens' School"
 hol_republiek.101.d:0 "Education is no longer left to the sects but to the Republic. A citizens' school opens in every town."
 hol_republiek.101.a:0 "Enter it into the record."
 hol_republiek.102.t:0 "The People's Army"
 hol_republiek.102.d:0 "Every citizen a soldier, every soldier a citizen. The militia replaces the hired battalion as the Republic's shield."
 hol_republiek.102.a:0 "Enter it into the record."
 hol_republiek.103.t:0 "The Classless Netherlands"
 hol_republiek.103.d:0 "The Republic has no subjects, only citizens. The old estates are struck from the record."
 hol_republiek.103.a:0 "Enter it into the record."
 hol_republiek.104.t:0 "People's Democracy"
 hol_republiek.104.d:0 "The Republic's example travels further than its fleet. Democratic envoys carry the constitution to smaller nations abroad."
 hol_republiek.104.a:0 "Enter it into the record."
 hol_republiek.105.t:0 "Permanent Envoys"
 hol_republiek.105.d:0 "Resident legations are sent to every capital still willing to hear a small nation. The Republic keeps a chair at every table."
 hol_republiek.105.a:0 "Enter it into the record."
 hol_republiek.106.t:0 "The Neutral League"
 hol_republiek.106.d:0 "Stockholm, Copenhagen, Oslo, Bern — the states that also refuse to choose. A league of the unaligned is signed in The Hague."
 hol_republiek.106.a:0 "Enter it into the record."
 hol_republiek.107.t:0 "Sister Republics"
 hol_republiek.107.d:0 "The Republic does not conquer; it sponsors. The northern democracies are recognised as natural allies and given charters of friendship."
 hol_republiek.107.a:0 "Enter it into the record."
 hol_republiek.108.t:0 "The Hanseatic Accord"
 hol_republiek.108.d:0 "The old North Sea and Baltic trade route is reconnected by a new treaty. The Hanseatic cities trade again under one flag of convenience."
 hol_republiek.108.a:0 "Enter it into the record."
 hol_republiek.109.t:0 "The Colonial Bloc"
 hol_republiek.109.d:0 "Lisbon and Madrid hold overseas empires too, and fear the same predators. A colonial bloc is offered against the great powers."
 hol_republiek.109.a:0 "Enter it into the record."
 hol_republiek.110.t:0 "The World Port"
 hol_republiek.110.d:0 "Rotterdam is not the Netherlands' port but Europe's. Dredgers widen the mouth; the world's grain and ore pass through it."
 hol_republiek.110.a:0 "Enter it into the record."
 hol_republiek.111.t:0 "Surinamese Bauxite"
 hol_republiek.111.d:0 "Bauxite proves worth more than gold. Concessions along the Suriname river are let to the Republic's smelters."
 hol_republiek.111.a:0 "Enter it into the record."
 hol_republiek.112.t:0 "The Curaçao Refinery"
 hol_republiek.112.d:0 "Venezuelan crude meets Curaçao's towers. The island becomes the Republic's pumping heart in the Caribbean."
 hol_republiek.112.a:0 "Enter it into the record."
 hol_republiek.113.t:0 "The Guiana Governorate"
 hol_republiek.113.d:0 "Guiana is made a governorate paying tribute to the Republic. A stadtholder-governor is appointed from The Hague."
 hol_republiek.113.a:0 "Enter it into the record."
 hol_republiek.114.t:0 "The South American Mainland"
 hol_republiek.114.d:0 "Venezuela and Colombia lie just west of Guiana. The Republic's agents map the approaches."
 hol_republiek.114.a:0 "Enter it into the record."
 hol_republiek.115.t:0 "Latin America"
 hol_republiek.115.d:0 "From Panama to the Plata, one governorate after another is planned. The map of the empire is redrawn south."
 hol_republiek.115.a:0 "Enter it into the record."
 hol_republiek.116.t:0 "The Seventeen Provinces"
 hol_republiek.116.d:0 "The whole Burgundian inheritance is claimed in one act: the seventeen provinces, north and south, under one Republic."
 hol_republiek.116.a:0 "Enter it into the record."
 hol_republiek.117.t:0 "Luxembourg"
 hol_republiek.117.d:0 "From 1815 to 1890 the Grand Duke and the King were the same man. The old personal union is recalled, and claimed."
 hol_republiek.117.a:0 "Enter it into the record."
 hol_republiek.118.t:0 "The Rhine Republic"
 hol_republiek.118.d:0 "The Republic does not swallow Germany; it raises a sister republic on the Rhine, bound by treaty and trade."
 hol_republiek.118.a:0 "Enter it into the record."
 hol_republiek.160.t:0 "The Second Ten Days' Campaign"
 hol_republiek.160.d:0 "The campaign of 1831 lasted ten days. This time the Republic marches to settle the southern question for good."
 hol_republiek.160.a:0 "Enter it into the record."
 hol_republiek.161.t:0 "The Lost Factories"
 hol_republiek.161.d:0 "Malacca, Ceylon, the Cape, Formosa — what the Company lost, the Republic means to take back. The first expeditions are funded."
 hol_republiek.161.a:0 "Enter it into the record."
 hol_republiek.162.t:0 "The Indies Federation"
 hol_republiek.162.d:0 "The Indies is no longer a colony but a federation sharing one crown with the Republic. Batavia gains a seat in the council."
 hol_republiek.162.a:0 "Enter it into the record."
 hol_republiek.135.t:0 "Imperial Customs Union"
 hol_republiek.135.d:0 "Tariffs inside the empire are abolished. Goods move freely from Amsterdam to Batavia, Paramaribo and the Cape."
 hol_republiek.135.a:0 "Enter it into the record."
 hol_republiek.136.t:0 "Imperial Shipping"
 hol_republiek.136.d:0 "Imperial shipping is carried by the Republic's merchant fleet. The convoys sail under one licence and one law."
 hol_republiek.136.a:0 "Enter it into the record."
 hol_republiek.137.t:0 "Imperial Defence Pact"
 hol_republiek.137.d:0 "An attack on any colony is declared an attack on the whole empire. The garrison plans are unified in The Hague."
 hol_republiek.137.a:0 "Enter it into the record."
 hol_republiek.138.t:0 "Javanese Industrial Belt"
 hol_republiek.138.d:0 "The Hague supplies capital; the colony supplies land and labour. A shared industrial belt rises along Java's north coast."
 hol_republiek.138.a:0 "Enter it into the record."
 hol_republiek.139.t:0 "Oil and Tin"
 hol_republiek.139.d:0 "A resources agreement: output ships north at a fixed share, priced in The Hague. The oil and tin keep the Republic's lamps lit."
 hol_republiek.139.a:0 "Enter it into the record."
 hol_republiek.140.t:0 "Royal Indies Army"
 hol_republiek.140.d:0 "One establishment, one drill book, Hague inspectors. The colonial army is folded into the Republic's order of battle."
 hol_republiek.140.a:0 "Enter it into the record."
 hol_republiek.141.t:0 "People's Council"
 hol_republiek.141.d:0 "The colonial councils gain seats, and obligations. Batavia sends representatives to the States-General."
 hol_republiek.141.a:0 "Enter it into the record."
 hol_republiek.142.t:0 "The Whole of the South Seas"
 hol_republiek.142.d:0 "Where to go next is decided jointly. The map of the archipelago is opened to the planners in The Hague."
 hol_republiek.142.a:0 "Enter it into the record."
 hol_republiek.143.t:0 "Surabaya Squadron"
 hol_republiek.143.d:0 "Colonial ports open to the Republic's fleet. A squadron is based at Surabaya to guard the eastern seas."
 hol_republiek.143.a:0 "Enter it into the record."
 hol_republiek.144.t:0 "Far Eastern Air Force"
 hol_republiek.144.d:0 "Routes and airfields pass under joint control. The Republic's aircraft range from Sumatra to the Philippines."
 hol_republiek.144.a:0 "Enter it into the record."
 hol_republiek.145.t:0 "Paramaribo Industry"
 hol_republiek.145.d:0 "The Hague supplies capital; the colony supplies land and labour. Workshops spread along the Suriname river."
 hol_republiek.145.a:0 "Enter it into the record."
 hol_republiek.146.t:0 "Bauxite and Refining"
 hol_republiek.146.d:0 "A resources agreement: output ships north at a fixed share, priced in The Hague. The bauxite feeds the Republic's smelters."
 hol_republiek.146.a:0 "Enter it into the record."
 hol_republiek.147.t:0 "West Indian Guard"
 hol_republiek.147.d:0 "One establishment, one drill book, Hague inspectors. The governorate's guard answers to the Republic."
 hol_republiek.147.a:0 "Enter it into the record."
 hol_republiek.148.t:0 "Governorate Council"
 hol_republiek.148.d:0 "The colonial councils gain seats, and obligations. Paramaribo sends a voice to the States-General."
 hol_republiek.148.a:0 "Enter it into the record."
 hol_republiek.149.t:0 "Latin America"
 hol_republiek.149.d:0 "Where to go next is decided jointly. The governorate's agents scout the mainland to the west."
 hol_republiek.149.a:0 "Enter it into the record."
 hol_republiek.150.t:0 "Caribbean Squadron"
 hol_republiek.150.d:0 "Colonial ports open to the Republic's fleet. A squadron is based at Curaçao to guard the Caribbean."
 hol_republiek.150.a:0 "Enter it into the record."
 hol_republiek.151.t:0 "Caribbean Air Force"
 hol_republiek.151.d:0 "Routes and airfields pass under joint control. The Republic's aircraft range the Antilles."
 hol_republiek.151.a:0 "Enter it into the record."
 hol_republiek.152.t:0 "Rand Industry"
 hol_republiek.152.d:0 "The Hague supplies capital; the colony supplies land and labour. The Rand's mines feed new workshops."
 hol_republiek.152.a:0 "Enter it into the record."
 hol_republiek.153.t:0 "Gold and Coal"
 hol_republiek.153.d:0 "A resources agreement: output ships north at a fixed share, priced in The Hague. The gold and coal cross the sea."
 hol_republiek.153.a:0 "Enter it into the record."
 hol_republiek.154.t:0 "Union Defence Force"
 hol_republiek.154.d:0 "One establishment, one drill book, Hague inspectors. The dominion's force is bound to the Republic's."
 hol_republiek.154.a:0 "Enter it into the record."
 hol_republiek.155.t:0 "Dominion Parliament"
 hol_republiek.155.d:0 "The colonial councils gain seats, and obligations. Pretoria sends a voice to the States-General."
 hol_republiek.155.a:0 "Enter it into the record."
 hol_republiek.156.t:0 "The African Interior"
 hol_republiek.156.d:0 "Where to go next is decided jointly. The map of the interior is opened to the planners in The Hague."
 hol_republiek.156.a:0 "Enter it into the record."
 hol_republiek.157.t:0 "Simon's Town Station"
 hol_republiek.157.d:0 "Colonial ports open to the Republic's fleet. A station is established at Simon's Town to guard the Cape route."
 hol_republiek.157.a:0 "Enter it into the record."
 hol_republiek.158.t:0 "South African Air Force"
 hol_republiek.158.d:0 "Routes and airfields pass under joint control. The Republic's aircraft range the high veldt."
 hol_republiek.158.a:0 "Enter it into the record."
 hol_republiek.120.t:0 "Survey for Oil"
 hol_republiek.120.d:0 "Geologists fan out across the polder. Sixty days on, the state books four more barrels of oil."
 hol_republiek.120.a:0 "Enter it into the record."
 hol_republiek.121.t:0 "Develop Iron Mines"
 hol_republiek.121.d:0 "The old iron hills are reopened. Sixty days on, the state books four more steel."
 hol_republiek.121.a:0 "Enter it into the record."
 hol_republiek.122.t:0 "Develop Bauxite"
 hol_republiek.122.d:0 "The bauxite seams are worked. Sixty days on, the state books four more aluminium."
 hol_republiek.122.a:0 "Enter it into the record."
 hol_republiek.123.t:0 "Colonial Recruitment"
 hol_republiek.123.d:0 "Auxiliary regiments are raised in the Indies. The colonial budget buys men where the metropole cannot."
 hol_republiek.123.a:0 "Enter it into the record."
 hol_republiek.124.t:0 "Police State"
 hol_republiek.124.d:0 "Colonial order is handed to the army. The governor sleeps easier; the colony watches the barracks."
 hol_republiek.124.a:0 "Enter it into the record."
 hol_republiek.125.t:0 "Renew the Charter"
 hol_republiek.125.d:0 "The Republic reissues the East India trade charter. The old company's rights are confirmed in a new patent."
 hol_republiek.125.a:0 "Enter it into the record."
 hol_republiek.126.t:0 "Reorganise the Governorates"
 hol_republiek.126.d:0 "Every puppet is raised to governorate status. The Republic gains extra factories for the tighter grip."
 hol_republiek.126.a:0 "Enter it into the record."
 hol_republiek.127.t:0 "Buy British Guiana"
 hol_republiek.127.d:0 "London needs cash; The Hague needs an estuary. The deed is signed, and the flag changes at Georgetown."
 hol_republiek.127.a:0 "Enter it into the record."
 hol_republiek.128.t:0 "Buy French Guiana"
 hol_republiek.128.d:0 "Paris will not like it, but Paris is poor. The estuary changes hands for a price."
 hol_republiek.128.a:0 "Enter it into the record."
 hol_republiek.129.t:0 "Annex Luxembourg"
 hol_republiek.129.d:0 "The old personal union is settled at last. The Grand Duchy returns to the Republic's fold."
 hol_republiek.129.a:0 "Enter it into the record."
 hol_republiek.130.t:0 "Requisition from the Indies"
 hol_republiek.130.d:0 "Raw materials ship out of Batavia in exchange for one factory's output at home. The Republic's workshops hum."
 hol_republiek.130.a:0 "Enter it into the record."
 hol_republiek.131.t:0 "Recruit in the Indies"
 hol_republiek.131.d:0 "Auxiliary troops are raised in the East Indies for the war's duration. The archipelago sends its sons."
 hol_republiek.131.a:0 "Enter it into the record."
 hol_republiek.132.t:0 "Curacao Oil Quota"
 hol_republiek.132.d:0 "The output of the Curaçao refinery is directed to the metropole first. The Republic's tanks fill before the colony's."
 hol_republiek.132.a:0 "Enter it into the record."
 hol_republiek.133.t:0 "Dismiss the Governor"
 hol_republiek.133.d:0 "The Hague removes a disobedient governor outright. The colony resents it; the order holds."
 hol_republiek.133.a:0 "Enter it into the record."
# ===== v15 military / expansion / joint focuses =====
 hol_mil_opbouw:0 "Rearm the Republic"
 hol_mil_opbouw_desc:0 "The Abjuration is won, but the young Republic stands alone. The States-General must rebuild the land, sea and air forces that once humbled empires - before another great power decides the Commonwealth is easy prey."
 hol_landmacht:0 "Expand the Army"
 hol_landmacht_desc:0 "The volunteer companies of the provinces must be welded into a single, professional land force capable of defending the dykes and polders of the homeland."
 hol_speciale_troepen:0 "Elite Raiding Forces"
 hol_speciale_troepen_desc:0 "The Republic has always lived by the sea. A corps of marines and airborne raiders will let us strike far beyond our narrow borders."
 hol_pantser:0 "The Armoured Corps"
 hol_pantser_desc:0 "The last war taught one lesson: steel and engines, not static trenches, will decide the next one. The Republic must master the tank."
 hol_weermacht:0 "The Standing Army"
 hol_weermacht_desc:0 "A citizen in arms remains the soul of the Republic - but only a permanent, drilled standing army can guarantee that the freedoms won in 1581 are never surrendered."
 hol_zeemacht:0 "Expand the Fleet"
 hol_zeemacht_desc:0 "Trade is the Republic's lifeblood, and trade needs a navy to guard it. New capital ships and escorts will keep the sea lanes open."
 hol_onderzee:0 "The Submarine Branch"
 hol_onderzee_desc:0 "Against any stronger foe, the silent service is our great equaliser. A fleet of submarines will menace the shipping of those who threaten us."
 hol_vloot:0 "The Blue-Water Fleet"
 hol_vloot_desc:0 "The Republic must not merely defend its harbours - it must be able to project power across the oceans once more."
 hol_luchtmacht:0 "Build the Air Force"
 hol_luchtmacht_desc:0 "The sky is the new battlefield. The Republic will raise squadrons to shield its cities and strike the enemy from above."
 hol_jacht:0 "Fighter Command"
 hol_jacht_desc:0 "Interceptors must keep the homeland's skies clear, so that no bomber ever reaches Amsterdam, Rotterdam or Utrecht."
 hol_bommen:0 "Bomber Command"
 hol_bommen_desc:0 "If war comes to us, we will carry it back to the enemy. A strategic bomber force will strike at the industrial heart of any aggressor."
 hol_herover_lage_landen:0 "Reclaim the Low Countries"
 hol_herover_lage_landen_desc:0 "The southern provinces - Brabant, Flanders, Wallonia - were once of the Union, before Habsburg and Bourbon tore them away. Now the Republic declares the Low Countries one and indivisible, and will take them back by force if need be."
 hol_offensief_frankrijk:0 "The Offensive Against France"
 hol_offensief_frankrijk_desc:0 "Across the border sits the old foe who sheltered the House of Orange and threatened the Republic from the south. The time has come to carry the war to France itself."
 hol_joint_raad:0 "The Council of the Republic"
 hol_joint_raad_desc:0 "A single council now binds the metropole and its overseas provinces, so that the Commonwealth speaks with one voice in matters of trade, defence and law."
 hol_joint_tolvrij:0 "The Free-Trade Zone"
 hol_joint_tolvrij_desc:0 "Customs barriers fall between the homeland and its dominions, binding the Commonwealth into a single, self-reinforcing market."
 hol_joint_scheepvaart:0 "Joint Shipping"
 hol_joint_scheepvaart_desc:0 "The merchant fleets of the Republic and its dominions sail under one flag, pooling hulls, crews and routes across the globe."
 hol_joint_defensie:0 "Joint Defence"
 hol_joint_defensie_desc:0 "The armies of the dominions will stand beside the metropole, so that an attack on one is answered by all."
 hol_ins_industrie:0 "East Indies Industrialisation"
 hol_ins_industrie_desc:0 "The factories of Java and Sumatra are modernised to feed the Republic's war economy."
 hol_ins_resources:0 "Exploit East Indies Resources"
 hol_ins_resources_desc:0 "Rubber, oil and tin flow in greater abundance from the archipelago to the metropole."
 hol_ins_leger:0 "The East Indies Army"
 hol_ins_leger_desc:0 "A colonial army is raised and drilled, ready to defend the archipelago against any invader."
 hol_ins_vloot:0 "The East Indies Fleet"
 hol_ins_vloot_desc:0 "A regional fleet guards the vital straits and sea lanes of the East."
 hol_ins_lucht:0 "The East Indies Air Force"
 hol_ins_lucht_desc:0 "Squadrons based in the islands keep watch over the approaches to the archipelago."
 hol_sur_industrie:0 "West Indies Industrialisation"
 hol_sur_industrie_desc:0 "Refineries and workshops rise in the Guianas and the Caribbean islands."
 hol_sur_resources:0 "Exploit West Indies Resources"
 hol_sur_resources_desc:0 "Bauxite, sugar and timber are extracted on an industrial scale for the Republic."
 hol_sur_leger:0 "The West Indies Army"
 hol_sur_leger_desc:0 "A garrison force secures the American possessions against local unrest and foreign meddling."
 hol_sur_vloot:0 "The West Indies Fleet"
 hol_sur_vloot_desc:0 "A squadron patrols the Caribbean, protecting the sugar and bauxite convoys."
 hol_sur_lucht:0 "The West Indies Air Force"
 hol_sur_lucht_desc:0 "Airfields across the islands give the Republic a foothold in the western hemisphere."
 hol_saf_industrie:0 "African Industrialisation"
 hol_saf_industrie_desc:0 "Mines and railways open the interior of the African dominion to the Republic's industry."
 hol_saf_resources:0 "Exploit African Resources"
 hol_saf_resources_desc:0 "Gold, diamonds and coal are shipped home in ever-growing quantities."
 hol_saf_leger:0 "The African Army"
 hol_saf_leger_desc:0 "A disciplined force secures the Cape and the interior against all comers."
 hol_saf_vloot:0 "The African Fleet"
 hol_saf_vloot_desc:0 "A naval force based at the Cape guards the route to the East Indies."
 hol_saf_lucht:0 "The African Air Force"
 hol_saf_lucht_desc:0 "Air patrols range over the veld, keeping the dominion's frontiers under watch."
# ===== v15 spirit =====
 hol_weermacht_idea:0 "Standing Army"
 hol_weermacht_idea_desc:0 "A permanent, professional army stands ready to defend the Republic's freedoms. Its drill and discipline make it the envy of every neighbour."
# ===== v15 events =====
 hol_republiek.190.t:0 "The Republic Rearms"
 hol_republiek.190.d:0 "The States-General has voted the funds, and the shipyards, foundries and airfields of the Republic hum with new life. Old sailors still remember the day the sea-beggars took Brielle; now a new generation swears the same oath, under the banner of the seven provinces."
 hol_republiek.190.a:0 "For the Republic"
 hol_republiek.191.t:0 "The Low Countries Declared Indivisible"
 hol_republiek.191.d:0 "The States-General has declared Brabant, Flanders and Wallonia inseparable from the Republic. The proclamation is read in every town of the Seven Provinces, and the regiments make ready. Belgium and Luxembourg are given a simple choice: rejoin the Union, or be taken back."
 hol_republiek.191.a:0 "The Low Countries are ours"
 hol_republiek.200.t:0 "The Road to Paris"
 hol_republiek.200.d:0 "The southern frontier is quiet, but only for now. The generals lay their maps before the States-General and ask how far the Republic is prepared to go. The answer will decide whether the war against France begins with a thunderclap, or with patience."
 hol_republiek.200.a:0 "March on Paris"
 hol_republiek.200.b:0 "Consolidate first"
 hol_republiek.203.t:0 "The First Council of the Commonwealth"
 hol_republiek.203.d:0 "Delegates from Batavia, Paramaribo, Pretoria and the Hague gather for the first time. The old quarrel returns: should the Republic command from the centre, or trust its provinces and dominions to govern themselves?"
 hol_republiek.203.a:0 "Command from the centre"
 hol_republiek.203.b:0 "Trust the provinces"
 hol_republiek.204.t:0 "The Annexation of Belgium"
 hol_republiek.204.d:0 "Brussels has fallen without a shot, and the southern Netherlands return to the Union. But how they are received will echo for generations - as equal provinces, or as conquered ground."
 hol_republiek.204.a:0 "Welcome them as equals"
 hol_republiek.204.b:0 "Treat them as conquered"
 hol_republiek.205.t:0 "The West India Company Charter"
 hol_republiek.205.d:0 "The charter of the West India Company is to be renewed. The shareholders press for sweeping powers over the American possessions; the regents urge restraint. The Republic must choose how free a hand to give its trading arm."
 hol_republiek.205.a:0 "Grant the full charter"
 hol_republiek.205.b:0 "Limit the charter"
# ===== v15.2 joint directorates =====
 hol_joint_sur:0 "The West Indies Directorate"
 hol_joint_sur_desc:0 "A standing directorate now governs the American provinces, coordinating their defence, trade and development with the Council of the Republic."
 hol_joint_ins:0 "The East Indies Directorate"
 hol_joint_ins_desc:0 "The sprawling archipelago is placed under a single directorate, binding Java, Sumatra and the Outer Islands to the Republic's purpose."
 hol_joint_saf:0 "The African Directorate"
 hol_joint_saf_desc:0 "The Cape dominion receives its own directorate, charged with guarding the southern route to the Indies."
 hol_joint_rijksbezit:0 "The United Commonwealth"
 hol_joint_rijksbezit_desc:0 "Metropole and colonies are fused into one Commonwealth, its provinces bound by a single tariff, fleet and oath."
 hol_sur_militair:0 "The West Indies Garrison"
 hol_sur_militair_desc:0 "Colonial regiments are raised across the Caribbean, ready to hold the islands against any landing."
 hol_ins_militair:0 "The East Indies Garrison"
 hol_ins_militair_desc:0 "A standing colonial army guards the archipelago's ports and oil fields."
 hol_saf_militair:0 "The African Garrison"
 hol_saf_militair_desc:0 "A mobile colonial force patrols the Cape's vast interior and frontier."
# ===== v15.3 =====
 hol_koloniaal_kracht_idea:0 "Colonial Trade Dividend"
 hol_koloniaal_kracht_idea_desc:0 "The Republic draws ever greater strength from its colonial empire - its factories, its coffers and its councils all reinforced."
 hol_koloniaal_kracht_idea_2:0 "Colonial Industrial Integration"
 hol_koloniaal_kracht_idea_2_desc:0 "The Republic draws ever greater strength from its colonial empire - its factories, its coffers and its councils all reinforced."
 hol_koloniaal_kracht_idea_3:0 "Colonial Mobilisation"
 hol_koloniaal_kracht_idea_3_desc:0 "The Republic draws ever greater strength from its colonial empire - its factories, its coffers and its councils all reinforced."
 hol_koloniaal_kracht_idea_4:0 "Imperial Union"
 hol_koloniaal_kracht_idea_4_desc:0 "The Republic draws ever greater strength from its colonial empire - its factories, its coffers and its councils all reinforced."
 hol_offensief_brittannie:0 "The Offensive Against Britain"
 hol_offensief_brittannie_desc:0 "The old maritime rival must be brought to heel. The Republic will carry the war across the North Sea and break Britain's grip on the sea lanes."
 hol_brother_republic:0 "Brother Republic"
 hol_brother_republic_desc:0 "A sister republic bound to the Commonwealth by oath and interest, free in its own affairs yet loyal to the Union."
# ===== v15.3 decisions =====
 hol_broederrepubliek:0 "Proclaim a Brother Republic"
 hol_broederrepubliek_desc:0 "Elevate a subject among France, Britain or the Rhenish Republic into a Brother Republic - bound to the Union by oath, yet free to govern itself."
# ===== obedience/pbalance =====
 hol_gehoorzaamheid:0 "Colonial Obedience"
 hol_sur_gehoorzaamheid_op:0 "Win over the West Indies"
 hol_sur_gehoorzaamheid_op_desc:0 "Spend time and political capital to raise obedience in the West Indies. Current obedience: [?hol_sur_gehoorzaamheid]/10."
 hol_ins_gehoorzaamheid_op:0 "Win over the East Indies"
 hol_ins_gehoorzaamheid_op_desc:0 "Spend time and political capital to raise obedience in the East Indies. Current obedience: [?hol_ins_gehoorzaamheid]/10."
 hol_saf_gehoorzaamheid_op:0 "Win over South Africa"
 hol_saf_gehoorzaamheid_op_desc:0 "Spend time and political capital to raise obedience in South Africa. Current obedience: [?hol_saf_gehoorzaamheid]/10."
 hol_macht_balans:0 "Balance of Power"
 hol_balans_regent:0 "Strengthen the Regency"
 hol_balans_regent_desc:0 "Concentrate authority in the Regent and the old regents' councils. Balance: [?hol_macht_balans] (0 = Regency, 100 = Commoners)."
 hol_balans_volk:0 "Empower the Commoners"
 hol_balans_volk_desc:0 "Give voice to the citizenry and the provincial assemblies. Balance: [?hol_macht_balans] (0 = Regency, 100 = Commoners)."
# ===== obedience trade =====
 hol_sur_investeren:0 "Invest in the West Indies"
 hol_sur_investeren_desc:0 "Spend political capital and ship rifles to the West Indies to raise their obedience by 1 (costs 500 infantry equipment)."
 hol_sur_uitbuiting:0 "Requisition the West Indies"
 hol_sur_uitbuiting_desc:0 "Seize the West Indies's resources for the metropole: gain a factory, manpower and rifles, but lose 1 obedience."
 hol_ins_investeren:0 "Invest in the East Indies"
 hol_ins_investeren_desc:0 "Spend political capital and ship rifles to the East Indies to raise their obedience by 1 (costs 500 infantry equipment)."
 hol_ins_uitbuiting:0 "Requisition the East Indies"
 hol_ins_uitbuiting_desc:0 "Seize the East Indies's resources for the metropole: gain a factory, manpower and rifles, but lose 1 obedience."
 hol_saf_investeren:0 "Invest in the South Africa"
 hol_saf_investeren_desc:0 "Spend political capital and ship rifles to the South Africa to raise their obedience by 1 (costs 500 infantry equipment)."
 hol_saf_uitbuiting:0 "Requisition the South Africa"
 hol_saf_uitbuiting_desc:0 "Seize the South Africa's resources for the metropole: gain a factory, manpower and rifles, but lose 1 obedience."
 hol_zaf_congo:0 "Let South Africa Annex the Congo"
 hol_zaf_congo_desc:0 "Grant the Cape dominion the Congo basin, uniting Dutch Africa from the Cape to the equator."
# ===== v20 =====
 hol_zaf_koopt_spaans_afrika:0 "Purchase Spain's African Colonies"
 hol_zaf_koopt_spaans_afrika_desc:0 "Offer Madrid a generous sum for its African possessions - Rio de Oro, Spanish Sahara and Spanish Guinea - handing them to the Cape dominion."
 hol_grondwet_centralistisch_idea:0 "Centralist Constitution"
 hol_grondwet_centralistisch_idea_desc:0 "A strong executive at the Hague, provinces ruled from the centre. Order first, liberty second."
 hol_grondwet_federalistisch_idea:0 "Federal Constitution"
 hol_grondwet_federalistisch_idea_desc:0 "The provinces keep their ancient privileges, bound in one Union by treaty and common defence."
 hol_grondwet_democratisch_idea:0 "Democratic Constitution"
 hol_grondwet_democratisch_idea_desc:0 "One man, one vote; a single chamber answerable to the citizens. The Republic belongs to its people."
 hol_republiek.4.b:0 "A Federal Union"
 hol_republiek.4.c:0 "A Democratic Republic"
# ===== v21 =====
 hol_power_balance:0 "Balance of Power"
 hol_regent_side:0 "The Regency"
 hol_volk_side:0 "The Commoners"
 hol_balance_neutral_range:0 "Balanced Rule"
 hol_regent_low_range:0 "Regency Ascendant"
 hol_regent_med_range:0 "Regency Dominant"
 hol_regent_high_range:0 "Regency Absolute"
 hol_volk_low_range:0 "People's Voice"
 hol_volk_med_range:0 "People's Power"
 hol_volk_high_range:0 "Sovereign People"
 hol_zeventien_idea_2:0 "The Seventeen Provinces"
 hol_zeventien_idea_2_desc:0 "The Union deepens: the provinces are bound ever more tightly to the Republic."
 hol_zeventien_idea_3:0 "The Seventeen Provinces"
 hol_zeventien_idea_3_desc:0 "The Union deepens: the provinces are bound ever more tightly to the Republic."
 hol_zeventien_idea_4:0 "The Seventeen Provinces"
 hol_zeventien_idea_4_desc:0 "The Union deepens: the provinces are bound ever more tightly to the Republic."
