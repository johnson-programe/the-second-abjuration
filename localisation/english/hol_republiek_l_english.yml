# ===== v27 new keys =====
 hol_republiek.202.t:0 "The Fourth Anglo-Dutch War"
 hol_republiek.202.d:0 "The envoys return from London empty-handed. For three centuries the Republic and England have traded, quarrelled and fought over the same seas, and now the ledger is closed. The Admiralty has been ordered to ready the fleet at Hellevoetsluis; the merchant houses of Amsterdam, who remember 1780 and the losses of the last war, are quietly moving their capital to neutral ports. There will be no more compromise over the Channel."
 hol_republiek.202.a:0 "The fleet will sail."
 hol_republiek.210.t:0 "Letters to the North"
 hol_republiek.210.d:0 "The Grand Pensionary has spent the winter reading the old correspondence of the Hanseatic towns. If the Republic is to be more than a memory of the seventeenth century, it must speak to the North in a language the North understands: grain, timber, iron ore and free passage through the Sound. Envoys are dispatched to Copenhagen, Stockholm, Oslo and Helsinki bearing a single proposal - a league of free northern peoples, bound to the Republic by oath rather than by conquest."
 hol_republiek.210.a:0 "Send the envoys."
 hol_republiek.211.t:0 "An Offer from the Republic"
 hol_republiek.211.d:0 "A Dutch envoy has been received at court, his coat still smelling of salt. He speaks of the old trade routes, of the Sound toll and the herring fleets, and of a Republic that would rather have brothers than subjects. In exchange for the oath, he offers the protection of the Dutch fleet, access to the colonial markets of the Indies, and a seat in the Council at The Hague. The court is divided: the merchants favour the offer, the nobility fear the loss of independence."
 hol_republiek.211.a:0 "Swear the oath."
 hol_republiek.211.b:0 "We will keep our own counsel."
 hol_republiek.212.t:0 "A New Brother in the North"
 hol_republiek.212.d:0 "The oath has been sworn in a ceremony of remarkable plainness: no crowns, no incense, only a signed instrument and a salute from the ships in the roads. Another northern people has chosen to bind its fortunes to the Republic. The Council records the name in the same ledger that holds the names of the seven provinces, and the clerks note, drily, that the ledger is filling up."
 hol_republiek.212.a:0 "Enter it in the ledger."
 hol_republiek.220.t:0 "The Black Seam"
 hol_republiek.220.d:0 "The engineers have driven a new gallery into the coal measures beneath the southern provinces. The seams run deep and dirty, and the miners work in shifts of twelve hours by lamplight, but the coke comes up in carts and the furnaces of the Republic no longer need to beg for fuel from the Ruhr. The company has already asked for a second shaft."
 hol_republiek.220.a:0 "Sink another shaft."
 hol_republiek.221.t:0 "The Rubber Gardens"
 hol_republiek.221.d:0 "Beyond the second canal the jungle has been cut back into ordered rows of Hevea trees, tapped at dawn by contract labourers from Java. The latex is smoked in sheets and shipped to Rotterdam, where the price is set for half of Europe. The planters ask for more land, more labour, and a guarantee that the Navy will keep the sea lanes open."
 hol_republiek.221.a:0 "Clear more land."
 hol_republiek.222.t:0 "Chromium from the Cape"
 hol_republiek.222.d:0 "The survey teams in the northern Transvaal have struck a seam of chromite running for miles. It is not gold, and the mining houses of Johannesburg are unimpressed, but the metallurgists in Delft understand what it means: armour plate, gun barrels, stainless steel. The Cape dominion has been instructed to open the ground at once."
 hol_republiek.222.a:0 "Open the ground."
 hol_republiek.223.t:0 "The Great Works"
 hol_republiek.223.d:0 "For a year the province has been one vast building site: polder drained, rail laid, foundations poured, housing thrown up for the workers before the machinery arrives. The cost is borne by the consumer - fewer bicycles, less coffee, no new radios - but when the dust settles there will be two new factories where there was pasture. The Republic has always preferred to build first and argue afterwards."
 hol_republiek.223.a:0 "Build first, argue later."
 hol_noordse_liga:0 "The Northern League"
 hol_noordse_liga_desc:0 "The Republic turns its face to the North. Denmark, Sweden, Norway and Finland are invited to swear the oath as Brother Republics - free in their own affairs, bound to The Hague in fleet, tariff and foreign policy."
 hol_lage_landen_leger_idea:0 "Army of the Low Countries"
 hol_lage_landen_leger_idea_desc:0 "Recruits from Flanders, Brabant and the Walloon valleys fill the ranks: the army of the Republic is no longer a polder army, but a Low Countries army."
 hol_develop_coal:0 "Work the Staatsmijnen"
 hol_develop_coal_desc:0 "Deepen the State Mines of Limburg at Heerlen, which have cut coal since 1902. After ninety days the state gains 4 steel - coke for the furnaces."
 hol_develop_rubber:0 "Plant Rubber Gardens"
 hol_develop_rubber_desc:0 "Clear jungle for Hevea plantations, as the planters have done in Sumatra and Malaya. After ninety days the state gains 6 rubber."
 hol_develop_chromium:0 "Open the Chromite Seams"
 hol_develop_chromium_desc:0 "Survey and open the chromite seams of the Transvaal. After a hundred and twenty days the state gains 6 chromium."
 hol_grote_ontwikkeling:0 "The Plan of Labour"
 hol_grote_ontwikkeling_desc:0 "The Plan van de Arbeid of 1935 in full: state-financed public works, canals, housing and factories. Consumer goods rise by 10% while it runs; the state receives two civilian factories and two building slots."

