 hol_oosters_grootboek:0 "The Eastern Ledger"
 hol_oosters_grootboek_desc:0 "The East Indies is not a territory. It is a ledger."
 hol_batavia:0 "Batavia"
 hol_batavia_desc:0 "The eastern capital, the Republic's second heart."
 hol_buitengewesten:0 "The Outer Islands"
 hol_buitengewesten_desc:0 "Beyond Java there are three thousand more islands."
 hol_petroleum_tin:0 "Oil and Tin"
 hol_petroleum_tin_desc:0 "Palembang's oil, Billiton's tin."
 hol_ethische_politiek:0 "The Ethical Policy"
 hol_ethische_politiek_desc:0 "The Republic owes the Indies a moral debt."
 hol_harde_hand:0 "The Iron Hand"
 hol_harde_hand_desc:0 "Disobedient islands get gunboats for an answer."
 hol_indische_gemenebest:0 "The Indies Commonwealth"
 hol_indische_gemenebest_desc:0 "The Indies becomes a federal dominion, sharing one crown with the Republic."

 hol_caribisch_bekken:0 "The Caribbean Basin"
 hol_caribisch_bekken_desc:0 "From Curaçao to Suriname, the Caribbean is a Dutch sea."
 hol_atlantisch_rijk:0 "The Atlantic Empire"
 hol_atlantisch_rijk_desc:0 "A republic that spans the Atlantic."

 hol_pacificatie_gent:0 "The Pacification of Ghent"
 hol_pacificatie_gent_desc:0 "In 1576 the seventeen provinces stood together, once."
 hol_vlaamse_kwestie:0 "The Flemish Question"
 hol_vlaamse_kwestie_desc:0 "The Flemish speak Dutch. They were merely given to someone else."
 hol_bourgondische_kreits:0 "The Burgundian Circle"
 hol_bourgondische_kreits_desc:0 "An imperial circle that was never legally dissolved."

 # ===== Ideas =====
 hol_crisisjaren_idea:0 "The Crisis Years"
 hol_crisisjaren_idea_desc:0 "Austerity held down inflation, and the whole country with it."
 hol_kroon_spanning_idea:0 "Crown Against Parliament"
 hol_kroon_spanning_idea_desc:0 "Five cabinets, not one problem solved."
 hol_republiek_geboren_idea:0 "A Republic Is Born"
 hol_republiek_geboren_idea_desc:0 "A country without a king appears on the map of Europe again."
 hol_zeven_provincien_idea:0 "The Union of Seven"
 hol_zeven_provincien_idea_desc:0 "Seven provinces, each with its own ledger and its own temper."
 hol_route_regent_idea:0 "The Regents' Republic"
 hol_route_regent_idea_desc:0 "A republic governed by those who pay for it. Not holy, but ruthlessly efficient — as long as the books stay black."
 hol_ware_vrijheid_idea:0 "True Freedom"
 hol_ware_vrijheid_idea_desc:0 "The stadtholderate is abolished for good. No place left for Orange."
 hol_heren_xvii_idea:0 "The Gentlemen Seventeen"
 hol_heren_xvii_idea_desc:0 "The company board is the state board."
 hol_wisselbank_idea:0 "The Exchange Bank"
 hol_wisselbank_idea_desc:0 "The world's money is settled here."
 hol_compagnie_staat_idea:0 "The Company Is the State"
 hol_compagnie_staat_idea_desc:0 "The state has shareholders, dividends and an annual report."
 hol_gouden_eeuw_idea:0 "A New Golden Age"
 hol_gouden_eeuw_idea_desc:0 "The seventeenth century never ended. It merely waited a hundred years."
 hol_vroedschap_idea:0 "The Town Councils"
 hol_vroedschap_idea_desc:0 "Cities govern themselves; The Hague has no say."
 hol_aandeel_stem_idea:0 "Shares and Votes"
 hol_aandeel_stem_idea_desc:0 "Propertied men vote, the rest pay tax."
 hol_mare_liberum_idea:0 "Mare Liberum"
 hol_mare_liberum_idea_desc:0 "Any flag may enter the harbour, provided it pays."
 hol_gewapende_neutraliteit_idea:0 "Armed Neutrality"
 hol_gewapende_neutraliteit_idea_desc:0 "We take no side, but we make taking sides expensive."
 hol_soldij_idea:0 "The Payroll"
 hol_soldij_idea_desc:0 "The Republic buys Europe's best soldiers with cash."
 hol_route_bataafs_idea:0 "The Batavian Republic"
 hol_route_bataafs_idea_desc:0 "A republic that belongs to every citizen. Loud, slow, but actually moving."
 hol_bataafse_grondwet_idea:0 "The Batavian Constitution"
 hol_bataafse_grondwet_idea_desc:0 "The first Dutch constitution, revived."
 hol_een_man_een_stem_idea:0 "One Man, One Vote"
 hol_een_man_een_stem_idea_desc:0 "The franchise is no longer tied to property."
 hol_nationale_vergadering_idea:0 "The National Assembly"
 hol_nationale_vergadering_idea_desc:0 "Unicameral, directly elected, answerable to citizens."
 hol_zuilen_vallen_idea:0 "The Pillars Fall"
 hol_zuilen_vallen_idea_desc:0 "Pillarisation dismantled; society mixes for the first time."
 hol_dageraad_idea:0 "The Dawn of Batavia"
 hol_dageraad_idea_desc:0 "For the first time, the Republic belongs to every Dutchman."
 hol_maatschappelijk_verdrag_idea:0 "The Social Contract"
 hol_maatschappelijk_verdrag_idea_desc:0 "Unemployment, sickness, old age — the Republic carries them."
 hol_burgerschool_idea:0 "The Citizens' School"
